<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEBUG TOOLS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;color:#0f0;font-family:'Courier New',monospace;padding:20px;font-size:14px;}
h1{font-size:20px;margin-bottom:20px;color:#0f0;border-bottom:1px solid #333;padding-bottom:10px;}
h2{font-size:16px;margin:20px 0 10px;color:#0a0;}
.section{background:#1a1a1a;border:1px solid #333;border-radius:4px;padding:16px;margin-bottom:16px;}
button{background:#222;color:#0f0;border:1px solid #0f0;padding:8px 16px;margin:4px;cursor:pointer;font-family:inherit;font-size:13px;border-radius:3px;transition:all 0.15s;}
button:hover{background:#0f0;color:#000;}
button.danger{border-color:#f44;color:#f44;}
button.danger:hover{background:#f44;color:#000;}
button.warn{border-color:#fa0;color:#fa0;}
button.warn:hover{background:#fa0;color:#000;}
button.blue{border-color:#48f;color:#48f;}
button.blue:hover{background:#48f;color:#000;}
.flag-row{display:flex;align-items:center;gap:10px;padding:4px 0;}
.flag-name{width:220px;color:#888;}
.flag-value{color:#0f0;font-weight:bold;}
.flag-value.off{color:#f44;}
.links a{display:inline-block;margin:4px;padding:8px 16px;border:1px solid #48f;color:#48f;text-decoration:none;border-radius:3px;transition:all 0.15s;}
.links a:hover{background:#48f;color:#000;}
#log{background:#0a0a0a;border:1px solid #222;padding:12px;margin-top:10px;max-height:200px;overflow-y:auto;font-size:12px;color:#888;white-space:pre-wrap;}
</style>
</head>
<body>

<h1>🔧 DEBUG TOOLS — こもれびゆうえんち2</h1>

<!-- Night Clear Flags -->
<div class="section">
  <h2>Night クリアフラグ</h2>
  <div id="night-flags"></div>
  <div style="margin-top:12px;">
    <button onclick="setAllNights()">全Nightクリア済みにする</button>
    <button class="danger" onclick="clearAllNights()">全Nightクリアを解除</button>
  </div>
</div>

<!-- Ending Flags -->
<div class="section">
  <h2>エンディング・セーブフラグ</h2>
  <div id="ending-flags"></div>
  <div style="margin-top:12px;">
    <button onclick="setFlag('ending_b_seen','true')">エンドB視聴済みにする</button>
    <button onclick="setFlag('ending_a_seen','true')">エンドA視聴済みにする</button>
    <button onclick="setFlag('save_point_night5','true')">Night5セーブポイント設定</button>
    <button onclick="setFlag('custom_night_unlocked','true')">カスタムナイト解放</button>
  </div>
</div>


<!-- Chat -->
<div class="section">
  <h2>チャット</h2>
  <div id="chat-display"></div>
  <div style="margin-top:12px;">
    <button onclick="setFlag('chat_unlocked','true')">チャット解放</button>
    <button onclick="setFlag('chat_freemode','true')">クイズモード開始</button>
    <button onclick="setFlag('chat_q1_clear','true');setFlag('chat_q2_clear','true');setFlag('chat_q3_clear','true');setFlag('chat_q4_clear','true');setFlag('chat_q5_clear','true')">全問正解済み</button>
    <button class="danger" onclick="clearChat()">チャット初期化</button>
  </div>
</div>


<!-- DM（ゆうやけさんぽ） -->
<div class="section">
  <h2>DM（ゆうやけさんぽ）</h2>
  <div id="dm-display"></div>
  <div style="margin-top:12px;">
    <button onclick="setFlag('dm_phase_1_complete','true')">Phase1完了</button>
    <button onclick="setFlag('dm_phase_2_complete','true')">Phase2完了</button>
    <button onclick="setFlag('dm_phase_3_complete','true')">Phase3完了</button>
    <button onclick="setFlag('dm_phase_4_complete','true')">Phase4完了</button>
    <button class="warn" onclick="setAllDMComplete()">全Phase完了</button>
    <button class="danger" onclick="clearDM()">DM初期化</button>
  </div>
</div>

<!-- 初回起動演出 -->
<div class="section">
  <h2>初回起動演出</h2>
  <div style="margin-top:8px;">
    <button onclick="localStorage.removeItem('first_boot_done');window.open('index.html','_blank');addLog('起動演出リセット→テスト')">起動演出テスト</button>
  </div>
</div>

<!-- 通知テスト -->
<div class="section">
  <h2>デスクトップ通知テスト</h2>
  <div style="margin-top:8px;">
    <button onclick="localStorage.setItem('night1_just_cleared','true');window.open('index.html','_blank');addLog('Night1通知テスト')">Night1通知</button>
    <button onclick="localStorage.setItem('night2_just_cleared','true');window.open('index.html','_blank');addLog('Night2通知テスト')">Night2通知</button>
    <button onclick="localStorage.setItem('night3_just_cleared','true');window.open('index.html','_blank');addLog('Night3通知テスト')">Night3通知</button>
    <button onclick="localStorage.setItem('night4_just_cleared','true');window.open('index.html','_blank');addLog('Night4通知テスト')">Night4通知</button>
    <button onclick="localStorage.setItem('night5_just_cleared','true');window.open('index.html','_blank');addLog('Night5通知テスト')">Night5通知</button>
  </div>
</div>

<!-- System Terminal -->
<div class="section">
  <h2>システム端末</h2>
  <div id="sys-display"></div>
  <div style="margin-top:12px;">
    <button onclick="setSysLevel(1)">Level 1</button>
    <button onclick="setSysLevel(2)">Level 2</button>
    <button onclick="setSysLevel(3)">Level 3</button>
    <button onclick="setSysLevel(4)">Level 4</button>
    <button class="warn" onclick="setSysLevel(5)">Level 5</button>
    <button class="danger" onclick="clearSys()">システム初期化</button>
  </div>
</div>

<!-- Direct Links -->
<div class="section">
  <h2>直接ジャンプ</h2>
  <div class="links">
    <a href="index.html">デスクトップ</a>
    <a href="official/index.html">特番サイト</a>
    <a href="twitter/index.html">Popin</a>
    <a href="mail/index.html">メール</a>
    <a href="chat/index.html">チャット</a>
  </div>
  <div class="links" style="margin-top:8px;">
    <a href="night1/">Night1</a>
    <a href="night2/">Night2</a>
    <a href="night3/">Night3</a>
    <a href="night4/">Night4</a>
    <a href="night5/">Night5</a>
    <a href="night6/">Night6</a>
  </div>
  <div class="links" style="margin-top:8px;">
    <a href="ending_a/">エンドA</a>
    <a href="ending_b/">エンドB</a>
    <a href="custom/">カスタムナイト</a>
    <a href="custom/game.html">カスタムゲーム</a>
    <a href="yumestudio/">ゆめスタジオ</a>
    <a href="yumestudio/staff.html">社員専用</a>
    <a href="system/">システム端末</a>
  </div>
</div>

<!-- All localStorage -->
<div class="section">
  <h2>全localStorage</h2>
  <button onclick="showAll()">全表示</button>
  <button class="danger" onclick="if(confirm('本当に全削除しますか？')){localStorage.clear();refreshAll();addLog('全localStorage削除');}">⚠ 全削除</button>
  <div id="log"></div>
</div>

<script>
var NIGHT_FLAGS = ['night1_clear','night2_clear','night3_clear','night4_clear','night5_clear','night6_clear'];
var ENDING_FLAGS = ['ending_a_seen','ending_b_seen','save_point_night5','custom_night_unlocked','night5_pages_unlocked','show_night6','chat_unlocked'];

function setFlag(key, val){
  localStorage.setItem(key, val);
  refreshAll();
  addLog('SET: '+key+' = '+val);
}

function removeFlag(key){
  localStorage.removeItem(key);
  refreshAll();
  addLog('REMOVE: '+key);
}

function toggleFlag(key){
  if(localStorage.getItem(key)==='true'){
    removeFlag(key);
    // nightX_clearをOFFにしたらpages_unlockedも消す
    var m = key.match(/^night(\d)_clear$/);
    if(m) removeFlag('night'+m[1]+'_pages_unlocked');
  } else {
    setFlag(key,'true');
    // nightX_clearをONにしたらpages_unlockedも設定
    var m = key.match(/^night(\d)_clear$/);
    if(m) setFlag('night'+m[1]+'_pages_unlocked','true');
  }
}

function setAllNights(){
  NIGHT_FLAGS.forEach(function(f){ localStorage.setItem(f,'true'); });
  for(var i=1;i<=6;i++) localStorage.setItem('night'+i+'_pages_unlocked','true');
  localStorage.setItem('save_point_night5','true');
  refreshAll();
  addLog('全Nightクリア済み（pages_unlocked含む）');
}

function clearAllNights(){
  NIGHT_FLAGS.forEach(function(f){ localStorage.removeItem(f); });
  for(var i=1;i<=6;i++) localStorage.removeItem('night'+i+'_pages_unlocked');
  localStorage.removeItem('save_point_night5');
  refreshAll();
  addLog('全Nightクリア解除（pages_unlocked含む）');
}


function clearChat(){
  localStorage.removeItem('chat_unlocked');
  localStorage.removeItem('chat_msg_count');
  localStorage.removeItem('chat_q1_clear');
  localStorage.removeItem('chat_q2_clear');
  localStorage.removeItem('chat_q3_clear');
  localStorage.removeItem('chat_q4_clear');
  localStorage.removeItem('chat_q5_clear');
  localStorage.removeItem('chat_warmup_stage');
  localStorage.removeItem('chat_freemode');
  localStorage.removeItem('chat_topic_watanabe');
  localStorage.removeItem('chat_topic_bridge');
  localStorage.removeItem('chat_topic_hikari');
  localStorage.removeItem('night3_unlocked');
  localStorage.removeItem('yumestudio_hint_shown');
  refreshAll();
  addLog('チャット全初期化');
}

function renderChat(){
  var el = document.getElementById('chat-display');
  var unlocked = localStorage.getItem('chat_unlocked')==='true';
  var freemode = localStorage.getItem('chat_freemode')==='true';
  var q1 = localStorage.getItem('chat_q1_clear')==='true';
  var q2 = localStorage.getItem('chat_q2_clear')==='true';
  var q3 = localStorage.getItem('chat_q3_clear')==='true';
  var q4 = localStorage.getItem('chat_q4_clear')==='true';
  var q5 = localStorage.getItem('chat_q5_clear')==='true';
  el.innerHTML = '<span class="flag-value '+(unlocked?'':'off')+'">解放:'+(unlocked?'ON':'OFF')+'</span> | '+
    '<span class="flag-value '+(freemode?'':'off')+'">クイズ:'+(freemode?'ON':'OFF')+'</span> | '+
    'Q1:'+(q1?'✓':'×')+' Q2:'+(q2?'✓':'×')+' Q3:'+(q3?'✓':'×')+' Q4:'+(q4?'✓':'×')+' Q5:'+(q5?'✓':'×');
}

function setAllDMComplete(){
  for(var i=1;i<=4;i++){
    localStorage.setItem('dm_phase_'+i+'_complete','true');
    localStorage.setItem('dm_phase_'+i+'_read','true');
  }
  refreshAll();
  addLog('DM全Phase完了');
}

function clearDM(){
  for(var i=1;i<=4;i++){
    localStorage.removeItem('dm_phase_'+i+'_complete');
    localStorage.removeItem('dm_phase_'+i+'_read');
    localStorage.removeItem('dm_step_'+i);
    for(var j=0;j<20;j++) localStorage.removeItem('dm_p'+i+'_c'+j);
  }
  refreshAll();
  addLog('DM全初期化');
}

function renderDM(){
  var el = document.getElementById('dm-display');
  var html = '';
  for(var i=1;i<=4;i++){
    var done = localStorage.getItem('dm_phase_'+i+'_complete')==='true';
    html += 'Phase'+i+':'+(done?'<span class="flag-value">完了</span>':'<span class="flag-value off">未</span>')+' ';
  }
  el.innerHTML = html;
}

function setSysLevel(n){
  localStorage.setItem('sys_access_level', String(n));
  refreshAll();
  addLog('システム端末 → Level '+n);
}

function clearSys(){
  localStorage.removeItem('sys_access_level');
  var keys=[];
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k.indexOf('sys_visited_')===0) keys.push(k);
  }
  keys.forEach(function(k){localStorage.removeItem(k);});
  refreshAll();
  addLog('システム端末 全初期化（レベル+閲覧履歴）');
}

function renderSys(){
  var el=document.getElementById('sys-display');
  var lvl=localStorage.getItem('sys_access_level')||'1';
  el.innerHTML='現在レベル: <span class="flag-value">Level '+lvl+'</span>';
}

function renderFlags(containerId, flags){
  var el = document.getElementById(containerId);
  var html = '';
  flags.forEach(function(f){
    var val = localStorage.getItem(f);
    var isOn = val === 'true';
    html += '<div class="flag-row">';
    html += '<span class="flag-name">'+f+'</span>';
    html += '<span class="flag-value '+(isOn?'':'off')+'">'+(isOn?'ON':'OFF')+'</span>';
    html += '<button onclick="toggleFlag(\''+f+'\')" style="font-size:11px;padding:2px 8px;">'+(isOn?'OFF':'ON')+'にする</button>';
    html += '</div>';
  });
  el.innerHTML = html;
}


function showAll(){
  var el = document.getElementById('log');
  var items = [];
  for(var i=0;i<localStorage.length;i++){
    var key = localStorage.key(i);
    items.push(key + ' = ' + localStorage.getItem(key));
  }
  items.sort();
  el.textContent = items.length ? items.join('\n') : '(空)';
}


function addLog(msg){
  var el = document.getElementById('log');
  el.textContent = '['+new Date().toLocaleTimeString()+'] '+msg+'\n'+el.textContent;
}

function refreshAll(){
  renderFlags('night-flags', NIGHT_FLAGS);
  renderFlags('ending-flags', ENDING_FLAGS);
  renderChat();
  renderDM();
  renderSys();
}

refreshAll();
addLog('DEBUG TOOLS 起動');
</script>

</body>
</html>
