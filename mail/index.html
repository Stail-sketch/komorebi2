<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受信ボックス</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Courier New',monospace;background:#1a1a2a;color:#c8c8d4;overflow:hidden;height:100vh;}

/* Header */
.header{display:flex;align-items:center;height:40px;background:#12121e;border-bottom:1px solid #2a2a3e;padding:0 16px;position:fixed;top:0;left:0;right:0;z-index:100;}
.header-title{font-size:15px;color:#8888aa;letter-spacing:1px;}
.header-count{margin-left:auto;font-size:13px;color:#555570;}

/* Layout */
.container{display:flex;margin-top:40px;height:calc(100vh - 40px);}

/* Mail list */
.mail-list{width:380px;min-width:300px;overflow-y:auto;border-right:1px solid #2a2a3e;background:#161624;flex-shrink:0;}
.mail-list.has-detail{width:380px;}
.mail-row{display:flex;align-items:center;padding:14px 16px;cursor:pointer;border-bottom:1px solid #1e1e30;font-size:14px;position:relative;transition:background 0.15s;}
.mail-row:hover{background:#1e1e34;}
.mail-row.selected{background:#22224a;border-left:2px solid #6666aa;}
.mail-row:not(.selected){border-left:2px solid transparent;}
.mail-row.unread .row-sender,.mail-row.unread .row-subject{color:#e0e0f0;font-weight:700;}
.mail-row.unread::after{content:'';position:absolute;left:7px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:#6670aa;}
.row-info{flex:1;overflow:hidden;padding-left:8px;}
.row-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;}
.row-sender{color:#9999b0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-date{color:#555570;font-size:10px;flex-shrink:0;margin-left:8px;}
.row-bottom{display:flex;align-items:baseline;overflow:hidden;}
.row-subject{color:#8888a0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-snippet{color:#555570;font-size:13px;margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1;}
.row-attach{color:#6666aa;font-size:14px;margin-left:6px;flex-shrink:0;}
.mail-empty{display:flex;align-items:center;justify-content:center;height:100%;color:#444460;font-size:14px;}

/* Detail pane */
.detail-pane{flex:1;overflow-y:auto;display:none;background:#1a1a2a;}
.detail-pane.show{display:flex;flex-direction:column;}
.detail-header{padding:16px 24px;border-bottom:1px solid #2a2a3e;background:#161624;}
.detail-subject{font-size:18px;color:#d0d0e0;margin-bottom:12px;line-height:1.5;}
.detail-meta{display:flex;align-items:center;gap:10px;}
.detail-from{font-size:15px;color:#9999b0;font-weight:600;}
.detail-to{font-size:13px;color:#555570;}
.detail-date-full{margin-left:auto;font-size:13px;color:#555570;}
.detail-body-wrap{flex:1;padding:20px 24px;overflow-y:auto;}
.detail-body{font-size:16px;line-height:2;color:#b0b0c8;white-space:pre-wrap;}
.detail-body a{color:#7788cc;text-decoration:none;border-bottom:1px solid #7788cc44;}
.detail-body a:hover{color:#99aaee;border-bottom-color:#99aaee;}
.detail-attachment{display:inline-flex;align-items:center;gap:6px;border:1px solid #2a2a3e;border-radius:4px;padding:8px 14px;margin-top:16px;cursor:pointer;font-size:14px;color:#8888a0;transition:background 0.2s;background:#161624;}
.detail-attachment:hover{background:#22224a;border-color:#4444666;}
.detail-back{display:none;font-size:16px;cursor:pointer;color:#6666aa;padding:8px;margin:-8px;margin-right:8px;}

/* Empty detail */
.empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:#333350;font-size:12px;flex:1;}

/* Night6 glitch */
.glitch-body{background:#000!important;color:#000!important;}
.glitch-body *{color:#000!important;}
.glitch-visible{color:#4a4a5a!important;background:#000!important;}

/* Scrollbar */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:#12121e;}
::-webkit-scrollbar-thumb{background:#2a2a3e;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#3a3a50;}

@media(max-width:768px){
  .mail-list.has-detail{display:none;}
  .detail-back{display:inline-block;}
  .detail-pane.show{width:100%;}
}
</style>
</head>
<body>

  mails.push({id:'spam_coupon', from:'campaign@food-delivery.example', subject:'初回注文500円OFFクーポン', snippet:'今すぐ使える！', body:'初回注文限定！500円OFFクーポン\n\nクーポンコード: WELCOME500\n有効期限: 4月30日まで\n\n今すぐ注文する >', unread:false, attachment:null, type:'normal'});
  mails.push({id:'spam_clinic', from:'info@dental-clinic.example', subject:'定期検診のお知らせ', snippet:'次回の検診日が近づいています', body:'定期検診のお知らせ\n\n次回の検診予定日: 4月15日（火）14:00\n\n変更・キャンセルの場合はお電話ください。\n\nさくら歯科クリニック', unread:false, attachment:null, type:'normal'});
  mails.push({id:'spam_library', from:'no-reply@city-library.example', subject:'図書館からのお知らせ：返却期限', snippet:'返却期限が近づいています', body:'以下の図書の返却期限が近づいています。\n\n■「日本のテレビ番組の歴史 1980-2000」\n  返却期限: 4月8日\n\nお早めにご返却ください。\n\n市立図書館', unread:false, attachment:null, type:'normal'});
  mails.push({id:'creepy_1997', from:'system@yume-studio.co.jp', subject:'テスト収録完了報告', snippet:'1997年9月の…', body:'日時: 1997年9月15日\n件名: テスト収録完了報告\n\n本日のテスト収録は予定通り完了しました。\n被験者の反応は想定内です。\n\nデータは保管庫に転送済み。\n\n追記: 次回の収録は中止となりました。', unread:true, attachment:null, type:'normal'});
  mails.push({id:'init', from:garbleSender(), subject:'■■■■', snippet:'…離さないで…あの名前を…', body:'「…離さないで…あの名前を…」', unread:true, attachment:null, type:'normal'});
  mails.push({id:'spam_music', from:'recommend@music-stream.example', subject:'今週のおすすめプレイリスト', snippet:'あなたへのおすすめ曲', body:'今週のおすすめプレイリスト\n\n♪ 夜のドライブ - Chill Mix\n♪ 90年代J-POPヒッツ\n♪ 作業用BGM - Lo-Fi\n\n今すぐ聴く >', unread:false, attachment:null, type:'normal'});

  // Track read state (localStorage永続化)
  var readState = JSON.parse(LS.getItem('mail_read_state') || '{}');
  function saveReadState() { LS.setItem('mail_read_state', JSON.stringify(readState)); }

  // ---- Header count ----
  function updateCount(){
    var count=0;
    mails.forEach(function(m){if(!readState[m.id]) count++;});
    var el=document.getElementById('headerCount');
    if(mails.length>0){
      el.textContent=count>0?'未読 '+count+' 件 / 全 '+mails.length+' 件':'全 '+mails.length+' 件';
    } else {
      el.textContent='';
    }
  }

  // ---- Render Mail List ----
  var selectedId=null;
  var listEl=document.getElementById('mailList');
  var detailEl=document.getElementById('detailPane');
  var emptyEl=document.getElementById('emptyState');
  var contentEl=document.getElementById('detailContent');

  function renderList(){
    listEl.innerHTML='';
    if(mails.length===0){
      listEl.innerHTML='<div class="mail-empty">メールはありません</div>';
      return;
    }
    mails.forEach(function(m){
      var row=document.createElement('div');
      row.className='mail-row'+(readState[m.id]?'':' unread')+(selectedId===m.id?' selected':'');
      row.innerHTML=
        '<div class="row-info">'+
          '<div class="row-top">'+
            '<span class="row-sender">'+esc(m.from)+'</span>'+
          '</div>'+
          '<div class="row-bottom">'+
            '<span class="row-subject">'+esc(m.subject)+'</span>'+
            '<span class="row-snippet">'+esc(m.snippet)+'</span>'+
            (m.attachment?'<span class="row-attach">&#9901;</span>':'')+
          '</div>'+
        '</div>';
      row.addEventListener('click', function(){ selectMail(m.id); });
      listEl.appendChild(row);
    });
  }

  function esc(s){
    var d=document.createElement('div');d.textContent=s;return d.innerHTML;
  }

  // チャット解放ボタン
  window.unlockChat = function(){
    LS.setItem('chat_unlocked','true');
    var btn = document.getElementById('chat-unlock-btn');
    if(btn){
      btn.textContent = '\u2705 チャットが追加されました！デスクトップに戻ってね';
      btn.style.color = '#4ca64c';
      btn.style.cursor = 'default';
      btn.onclick = null;
    }
  };

  // ---- Select Mail ----
  function selectMail(id){
    selectedId=id;
    readState[id]=true;
    saveReadState();
    var m=null;
    for(var i=0;i<mails.length;i++){if(mails[i].id===id){m=mails[i];break;}}
    if(!m) return;

    listEl.classList.add('has-detail');
    detailEl.classList.add('show');
    emptyEl.style.display='none';
    contentEl.style.display='flex';
    contentEl.style.flexDirection='column';
    contentEl.style.height='100%';

    document.getElementById('dSubject').textContent=m.subject;
    document.getElementById('dFrom').textContent=m.from;
    document.getElementById('dDate').textContent='';

    var bodyEl=document.getElementById('dBody');
    var attEl=document.getElementById('dAttachment');
    attEl.innerHTML='';

    // Night6 glitch
    if(night6){
      bodyEl.className='detail-body glitch-body';
      bodyEl.innerHTML='<span class="glitch-visible">「…もう…話せない…」</span>';
      document.getElementById('dSubject').style.cssText='color:#1a1a2a;background:#1a1a2a;';
    } else {
      bodyEl.className='detail-body';
      // Allow HTML for chat link and evidence items
      if(m.id==='n3' || m.id==='n2_chat' || m.type==='n5'){
        bodyEl.innerHTML=m.body;
      } else {
        bodyEl.textContent='';
        bodyEl.innerText=m.body;
      }
      document.getElementById('dSubject').style.cssText='';
    }

    // Attachments
    if(m.attachment){
      var att=document.createElement('div');
      att.className='detail-attachment';
      if(m.attachment.type==='potamaru'){
        att.innerHTML='&#9835; '+esc(m.attachment.name);
        att.addEventListener('click',function(){ playPotamaruSound(); });
      } else if(m.attachment.type==='ukki'){
        att.innerHTML='&#9634; '+esc(m.attachment.name);
        att.title='ファイルを開けません';
      }
      attEl.appendChild(att);
    }

    renderList();
    updateCount();
  }

  // ---- Potamaru Sound ----
  function playPotamaruSound(){
    try{
      var ctx=new (window.AudioContext||window.webkitAudioContext)();
      var osc=ctx.createOscillator();
      var gain=ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if(flag('night3_clear')){
        osc.type='sine';
        osc.frequency.setValueAtTime(440,ctx.currentTime);
        gain.gain.setValueAtTime(0.15,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+2);
      } else {
        osc.type='sawtooth';
        osc.frequency.setValueAtTime(800,ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(200,ctx.currentTime+0.5);
        osc.frequency.linearRampToValueAtTime(900,ctx.currentTime+1.0);
        osc.frequency.linearRampToValueAtTime(100,ctx.currentTime+1.5);
        osc.frequency.setValueAtTime(800,ctx.currentTime+1.5);
        gain.gain.setValueAtTime(0.4,ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.5,ctx.currentTime+1);
        gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+2);
      }

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime+2);
    }catch(e){}
  }

  // ---- Back button (mobile) ----
  document.getElementById('detailBack').addEventListener('click',function(){
    selectedId=null;
    listEl.classList.remove('has-detail');
    detailEl.classList.remove('show');
    emptyEl.style.display='';
    contentEl.style.display='none';
    renderList();
  });

  // ---- Night6 full glitch ----
  if(night6){
    document.body.style.background='#080810';
    setInterval(function(){
      document.body.style.opacity=Math.random()>0.1?'1':'0.7';
    },200);
  }

  // ---- Init ----
  renderList();
  updateCount();

})();
</script>
<script src="../js/main.js"></script>
</body>
