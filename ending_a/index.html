<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ending A - あの番組を覚えていますか 〜木漏れ日遊園地編〜</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Yu Mincho','YuMincho','Hiragino Mincho ProN','MS PMincho',serif;
  }
  #screen{
    position:fixed;top:0;left:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    z-index:1;
  }

  #crt-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:20;
    opacity:0.3;
    transition:opacity 4s ease;
  }
  #crt-overlay::before{
    content:'';position:absolute;top:0;left:0;width:100%;height:100%;
    background:repeating-linear-gradient(0deg,
      rgba(0,255,65,0.03) 0px, rgba(0,255,65,0.03) 1px,
      transparent 1px, transparent 3px);
    animation:crt-scroll 4s linear infinite;
  }
  #crt-overlay::after{
    content:'';position:absolute;top:0;left:0;width:100%;height:100%;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
  }
  @keyframes crt-scroll{0%{background-position:0 0;}100%{background-position:0 100vh;}}

  .terminal-line{
    color:#00ff41;
    font-family:'Courier New',Consolas,monospace;
    font-size:clamp(14px,2.2vw,20px);
    text-align:left;opacity:0;white-space:pre;
    text-shadow:0 0 8px rgba(0,255,65,0.4);
    letter-spacing:0.08em;line-height:1.8;
    transition:opacity 0.3s ease;
  }
  .terminal-line.visible{opacity:1;}
  .terminal-line.error{
    color:#ff3333;
    text-shadow:0 0 8px rgba(255,50,50,0.5);
  }
  .terminal-line.warning{
    color:#ffaa00;
    text-shadow:0 0 8px rgba(255,170,0,0.4);
  }

  #terminal-container{
    width:80%;max-width:700px;max-height:80vh;
    overflow:hidden;display:flex;flex-direction:column;gap:0.2em;
  }

  .yoshida-text{
    color:#e0e0e0;
    font-family:'Yu Mincho','YuMincho','Hiragino Mincho ProN',serif;
    font-size:clamp(18px,3vw,28px);
    text-align:center;opacity:0;position:absolute;
    letter-spacing:0.15em;line-height:2.2;
    transition:opacity 0.4s ease;
  }
  .yoshida-text.visible{opacity:1;}

  .akane-text{
    color:#e8d0d8;
    font-family:'Yu Mincho','YuMincho','Hiragino Mincho ProN',serif;
    font-size:clamp(10px,1.5vw,14px);
    text-align:center;opacity:0;position:absolute;
    letter-spacing:0.3em;line-height:2;
    transition:opacity 4s ease, font-size 4s ease, letter-spacing 4s ease;
    filter:blur(0.3px);
  }
  .akane-text.visible{
    opacity:0.5;
    font-size:clamp(16px,2.5vw,24px);
    letter-spacing:0.2em;
  }

  .delete-line{
    color:#ff5555;
    font-family:'Courier New',Consolas,monospace;
    font-size:clamp(12px,1.8vw,18px);
    text-align:left;opacity:0;white-space:pre;
    text-shadow:0 0 6px rgba(255,85,85,0.4);
    letter-spacing:0.08em;line-height:1.8;
    transition:opacity 0.3s ease;
  }
  .delete-line.visible{opacity:1;}

  #crt-off-line{
    position:fixed;left:0;width:100%;
    background:#fff;z-index:110;
    pointer-events:none;opacity:0;
  }

  #epilogue-container{
    width:80%;max-width:600px;
    display:flex;flex-direction:column;gap:0.4em;
    align-items:center;
  }
  .epilogue-line{
    color:rgba(100,100,90,0.5);
    font-family:'Courier New',Consolas,monospace;
    font-size:clamp(11px,1.6vw,15px);
    text-align:center;white-space:pre;
    letter-spacing:0.1em;line-height:1.8;
  }

  #noise-layer{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:18;overflow:hidden;
  }
  .noise-line{
    position:absolute;height:1px;
    background:rgba(0,255,65,0.15);
    animation:noise-flash 0.15s linear forwards;
  }
  @keyframes noise-flash{0%{opacity:1;}100%{opacity:0;}}
</style>
</head>
<body>
<div id="screen"></div>
<div id="crt-overlay"></div>
<div id="noise-layer"></div>
<div id="crt-off-line"></div>

<script>
if(localStorage.getItem('night6_clear')!=='true'){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#333;font-family:monospace;font-size:14px;">アクセスできません</div>';throw new Error();}
(function(){
  var screen = document.getElementById('screen');
  var crtOverlay = document.getElementById('crt-overlay');
  var noiseLayer = document.getElementById('noise-layer');

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function clearScreen(){
    screen.innerHTML = '';
    screen.style.display = 'flex';
    screen.style.alignItems = 'center';
    screen.style.justifyContent = 'center';
    screen.style.flexDirection = 'column';
  }

  function setCrtIntensity(level){
    crtOverlay.style.opacity = String(0.2 + level * 0.8);
  }

  var noiseInterval = null;
  function startNoise(intensity){
    if(noiseInterval) clearInterval(noiseInterval);
    noiseInterval = setInterval(function(){
      if(Math.random() > intensity) return;
      var line = document.createElement('div');
      line.className = 'noise-line';
      line.style.top = (Math.random()*100)+'%';
      line.style.left = '0';
      line.style.width = (20+Math.random()*80)+'%';
      if(Math.random()>0.5){line.style.left='auto';line.style.right='0';}
      noiseLayer.appendChild(line);
      setTimeout(function(){line.remove();},200);
    },80);
  }
  function stopNoise(){
    if(noiseInterval){clearInterval(noiseInterval);noiseInterval=null;}
    noiseLayer.innerHTML='';
  }

  var reduceFlash = localStorage.getItem('reduce_flash') === 'true';

  function flashWhite(duration){
    if(reduceFlash) return;
    var f = document.createElement('div');
    f.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:25;pointer-events:none;';
    document.body.appendChild(f);
    setTimeout(function(){ f.remove(); }, duration || 80);
  }

  function screenBlink(duration){
    var blink = document.createElement('div');
    blink.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:25;pointer-events:none;';
    document.body.appendChild(blink);
    return wait(duration||150).then(function(){blink.remove();});
  }

  function typewriterLine(container, text, speed, cls){
    return new Promise(function(resolve){
      var line = document.createElement('div');
      line.className = (cls || 'terminal-line') + ' visible';
      line.textContent = '';
      container.appendChild(line);
      var i = 0;
      var iv = setInterval(function(){
        if(i < text.length){ line.textContent += text[i]; i++; }
        else { clearInterval(iv); resolve(line); }
      }, speed || 40);
    });
  }

  function typewriterCutoff(container, text, cutAt, speed){
    return new Promise(function(resolve){
      var line = document.createElement('div');
      line.className = 'terminal-line visible';
      line.textContent = '';
      container.appendChild(line);
      var i = 0;
      var iv = setInterval(function(){
        if(i < cutAt){ line.textContent += text[i]; i++; }
        else { clearInterval(iv); resolve(line); }
      }, speed || 40);
    });
  }

  function showYoshidaLine(text){
    return new Promise(function(resolve){
      var el = document.createElement('div');
      el.className = 'yoshida-text';
      el.textContent = text;
      screen.appendChild(el);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ el.classList.add('visible'); });
      });
      setTimeout(function(){ resolve(el); }, 300);
    });
  }

  function showAkaneLine(text){
    return new Promise(function(resolve){
      var el = document.createElement('div');
      el.className = 'akane-text';
      el.textContent = text;
      screen.appendChild(el);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ el.classList.add('visible'); });
      });
      setTimeout(function(){ resolve(el); }, 300);
    });
  }

  /* ===== MAIN SEQUENCE ===== */
  async function main(){
    setCrtIntensity(0.1);
    startNoise(0.1);
    await wait(1000);

    // --- STAGE 1: 黒幕のログ ---
    var termContainer = document.createElement('div');
    termContainer.id = 'terminal-container';
    screen.appendChild(termContainer);

    var logLines = [
      { text:'> 接続確認　完了', pause:800 },
      { text:'> 対象：K-059', pause:800 },
      { text:'> …戻ってきたか　K-059', pause:1500 },
      { text:'> 感情データ収集率：98.7%', pause:1200 },
    ];

    for(var i = 0; i < logLines.length; i++){
      setCrtIntensity(0.1 + (i/logLines.length)*0.2);
      await typewriterLine(termContainer, logLines[i].text, 35);
      await wait(logLines[i].pause);
    }

    // --- STAGE 2: 吉田が割り込む ---
    startNoise(0.3);
    await typewriterCutoff(termContainer, '> 転送プロトコル起動', 10, 35);
    await wait(200);

    flashWhite(80);
    setCrtIntensity(0.5);
    await wait(500);

    await typewriterLine(termContainer, '> ERROR: 外部入力検知', 25, 'terminal-line error');
    await wait(400);
    await typewriterLine(termContainer, '> 送信元：管理者権限', 25, 'terminal-line error');
    await wait(1500);

    clearScreen();
    stopNoise();
    setCrtIntensity(0.05);
    await wait(2000);

    // --- STAGE 3: 吉田 → K-059 ---
    var y1 = await showYoshidaLine('「…来てくれたんだな」');
    await wait(3500);
    await screenBlink(150);
    y1.remove();

    var y2 = await showYoshidaLine('「全部読んでくれたか」');
    await wait(3000);
    await screenBlink(150);
    y2.remove();

    var y3 = await showYoshidaLine('「…ありがとう」');
    await wait(3500);
    await screenBlink(150);
    y3.remove();

    await wait(2000);

    // --- STAGE 4: シャットダウン宣言 ---
    var yDec = await showYoshidaLine('「…システムを落とす」');
    await wait(4000);
    await screenBlink(150);
    yDec.remove();

    await wait(1500);

    // --- STAGE 5: 黒幕 vs 吉田 ---
    startNoise(0.3);
    setCrtIntensity(0.5);

    var termContainer2 = document.createElement('div');
    termContainer2.id = 'terminal-container';
    screen.appendChild(termContainer2);

    var r1 = await typewriterLine(termContainer2, '> 停止できません', 20, 'terminal-line warning');
    await wait(700);
    var r2 = await typewriterLine(termContainer2, '> 「あかね」のデータが消滅します', 20, 'terminal-line warning');
    await wait(800);
    var r3 = await typewriterLine(termContainer2, '> 復元は不可能です', 20, 'terminal-line warning');
    await wait(1200);

    // Yoshida overrides — deliberate, slower pace
    startNoise(0.5);
    setCrtIntensity(0.7);
    await typewriterLine(termContainer2, '> OVERRIDE: 管理者権限で強制実行', 30, 'terminal-line error');
    await wait(800);

    // Hard cut: warnings vanish
    var blink5 = document.createElement('div');
    blink5.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:25;pointer-events:none;';
    document.body.appendChild(blink5);
    r1.remove(); r2.remove(); r3.remove();
    await wait(200);
    blink5.remove();

    startNoise(0.4);
    await typewriterLine(termContainer2, '> SYSTEM SHUTDOWN INITIATED', 18, 'terminal-line error');
    await wait(500);

    // --- STAGE 6: 削除シーケンス ---
    var blank = document.createElement('div');
    blank.className = 'terminal-line visible';
    blank.innerHTML = '&nbsp;';
    termContainer2.appendChild(blank);
    await wait(400);

    // New cast — pulled out fast
    var newCast = ['kururu.dll','madara.dll','arane.dll','kasumi.dll','yowari.dll'];
    for(var n = 0; n < newCast.length; n++){
      await typewriterLine(termContainer2, '> '+newCast[n]+' ... 削除', 15, 'delete-line');
      await wait(200);
    }

    await wait(600);

    // Original cast — released gently
    var oldCast = ['kitsune_01.dat','yuuyake_02.dat','tanken_03.dat','potamaru_04.dat'];
    for(var o = 0; o < oldCast.length; o++){
      await typewriterLine(termContainer2, '> '+oldCast[o]+' ... 解放', 40, 'delete-line');
      await wait(500);
    }

    await wait(800);

    // akane.dat — system hesitates
    var akaneLine = await typewriterCutoff(termContainer2, '> akane.dat ...', 15, 30);
    akaneLine.className = 'delete-line visible';

    stopNoise();
    crtOverlay.style.transition = 'opacity 3s ease';
    crtOverlay.style.opacity = '0.05';
    await wait(4000);

    clearScreen();
    await wait(1500);

    // Yoshida's farewell
    var yFinal1 = await showYoshidaLine('「…ごめんな、あかね」');
    await wait(4000);
    await screenBlink(150);
    yFinal1.remove();

    var yFinal2 = await showYoshidaLine('「もう　休んでいいんだよ」');
    await wait(4500);
    await screenBlink(150);
    yFinal2.remove();

    await wait(2000);

    // Resume deletion
    var termContainer3 = document.createElement('div');
    termContainer3.id = 'terminal-container';
    screen.appendChild(termContainer3);
    startNoise(0.15);
    crtOverlay.style.transition = 'opacity 1s ease';
    setCrtIntensity(0.15);

    await typewriterLine(termContainer3, '> akane.dat ... 解放', 60, 'delete-line');
    await wait(1500);

    await typewriterLine(termContainer3, '> core_system ... 強制停止', 22, 'delete-line');
    await wait(400);
    await typewriterLine(termContainer3, '> process_main ... 停止', 22, 'delete-line');
    await wait(300);

    // System dies
    flashWhite(100);
    await wait(100);

    stopNoise();
    crtOverlay.style.transition = 'opacity 0.1s';
    crtOverlay.style.opacity = '0';
    clearScreen();

    // --- STAGE 7: 完全な沈黙 ---
    await wait(8000);

    // --- STAGE 8: あかねの声 ---
    var ak1 = await showAkaneLine('…パパ');
    await wait(6000);
    ak1.style.transition = 'opacity 3s ease';
    ak1.style.opacity = '0';
    await wait(3000);
    ak1.remove();

    await wait(3000);

    var ak2 = await showAkaneLine('もう　だいじょうぶだよ');
    await wait(7000);
    ak2.style.transition = 'opacity 4s ease';
    ak2.style.opacity = '0';
    await wait(4000);
    ak2.remove();

    await wait(3000);

    var ak3 = await showAkaneLine('…ありがとう');
    await wait(8000);
    ak3.style.transition = 'opacity 5s ease';
    ak3.style.opacity = '0';
    await wait(5000);
    ak3.remove();

    // --- STAGE 9: 吉田の最後の一言 ---
    await wait(4000);

    var yLast = await showYoshidaLine('「…おやすみ、あかね」');
    await wait(8000);
    yLast.style.transition = 'opacity 3s ease';
    yLast.style.opacity = '0';
    await wait(3000);
    yLast.remove();

    // --- STAGE 10: ブラウン管消え → エピローグ ---
    await wait(3000);

    var topBar = document.createElement('div');
    topBar.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:50%;background:#fff;z-index:110;pointer-events:none;transition:height 1.5s ease-in;';
    var botBar = document.createElement('div');
    botBar.style.cssText = 'position:fixed;bottom:0;left:0;width:100%;height:50%;background:#fff;z-index:110;pointer-events:none;transition:height 1.5s ease-in;';
    document.body.appendChild(topBar);
    document.body.appendChild(botBar);

    await wait(50);
    topBar.style.height = '50%';
    botBar.style.height = '50%';
    await wait(100);
    topBar.style.transition = 'height 1.2s ease-in';
    botBar.style.transition = 'height 1.2s ease-in';
    topBar.style.height = 'calc(50% - 1px)';
    botBar.style.height = 'calc(50% - 1px)';

    await wait(1200);

    topBar.style.transition = 'height 0.8s ease-out, opacity 0.8s ease-out';
    botBar.style.transition = 'height 0.8s ease-out, opacity 0.8s ease-out';
    topBar.style.height = '0';
    botBar.style.height = '0';

    var crtLine = document.getElementById('crt-off-line');
    crtLine.style.top = '50%';
    crtLine.style.height = '2px';
    crtLine.style.opacity = '1';
    crtLine.style.transform = 'translateY(-50%)';

    await wait(800);
    topBar.remove();
    botBar.remove();

    crtLine.style.transition = 'opacity 1.5s ease, width 1.5s ease';
    crtLine.style.opacity = '0';
    await wait(1500);
    crtLine.remove();

    clearScreen();
    await wait(4000);

    var epiContainer = document.createElement('div');
    epiContainer.id = 'epilogue-container';
    screen.appendChild(epiContainer);

    function typeEpilogue(text){
      return new Promise(function(resolve){
        var line = document.createElement('div');
        line.className = 'epilogue-line';
        line.textContent = '';
        epiContainer.appendChild(line);
        var i = 0;
        var iv = setInterval(function(){
          if(i < text.length){ line.textContent += text[i]; i++; }
          else { clearInterval(iv); resolve(line); }
        }, 60);
      });
    }

    await typeEpilogue('こもれびゆうえんち　全システム停止');
    await wait(1500);
    await typeEpilogue('最終アクセス：吉田一郎');
    await wait(3000);
    await typeEpilogue('');
    await typeEpilogue('全被験者　解放');
    await wait(4000);
    await typeEpilogue('');
    await typeEpilogue('この番組は終了しました');
    await wait(2000);
    await typeEpilogue('ご視聴ありがとうございました');

    try {
      localStorage.setItem('ending_a_seen', 'true');
      localStorage.removeItem('save_point_night5');
      localStorage.removeItem('current_night');
      localStorage.removeItem('game_progress');
    } catch(e){}

    await wait(5000);

    var whiteFade = document.createElement('div');
    whiteFade.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:200;pointer-events:none;opacity:0;transition:opacity 4s ease;';
    document.body.appendChild(whiteFade);
    await wait(50);
    whiteFade.style.opacity = '1';
    await wait(4500);

    localStorage.setItem('enda_just_returned', 'true');
    window.location.href = '../index.html';
  }

  main();
})();
</script>
</body>
</html>
