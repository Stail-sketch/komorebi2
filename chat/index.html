<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャット - あの番組を覚えていますか 〜木漏れ日遊園地編〜</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      background:#f0e6d3;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Segoe UI','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
      padding:0;
    }

    .chat-window{
      width:100%;max-width:100%;height:100vh;max-height:none;
      background:#faf6ef;
      border:none;
      border-radius:0;
      display:flex;flex-direction:column;overflow:hidden;
    }

    /* Header */
    .chat-header{
      background:linear-gradient(180deg,#f5deb3 0%,#e8c88a 100%);
      padding:12px 16px;
      display:flex;align-items:center;gap:12px;
      border-bottom:2px solid #c8a96e;
    }
    .avatar{
      width:44px;height:44px;
      background:#fff8e7;border:2px solid #c8a96e;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:24px;flex-shrink:0;position:relative;
    }
    .status-dot{
      position:absolute;bottom:0;right:0;
      width:12px;height:12px;background:#6bba6b;border-radius:50%;
      border:2px solid #e8c88a;
    }
    .contact-info{flex:1;}
    .contact-name{font-size:20px;font-weight:700;color:#5d4220;}
    .contact-status{font-size:14px;color:#6bba6b;}

    /* Channel name bar */
    .channel-bar{
      background:#f5edd8;border-bottom:1px solid #ddd0b8;
      padding:8px 16px;font-size:15px;color:#8b7355;
      display:flex;align-items:center;gap:6px;
    }
    .channel-bar .hash{color:#c8a96e;font-weight:700;font-size:16px;}

    /* Chat area */
    .chat-area{
      flex:1;background:#faf6ef;overflow-y:auto;padding:12px 16px;
    }
    .chat-area::-webkit-scrollbar{width:8px;}
    .chat-area::-webkit-scrollbar-track{background:#f5edd8;}
    .chat-area::-webkit-scrollbar-thumb{background:#d4bd8a;border-radius:4px;}

    .message{
      display:flex;gap:10px;margin-bottom:12px;
      padding:4px 0;
    }
    .msg-avatar{
      width:36px;height:36px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:18px;flex-shrink:0;border:2px solid #ddd0b8;
    }
    .message.partner .msg-avatar{background:#fff3d6;border-color:#c8a96e;}
    .message.user .msg-avatar{background:#d6eaff;border-color:#7badd4;}
    .msg-body{flex:1;min-width:0;}
    .msg-header{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
    .msg-name{font-size:16px;font-weight:700;}
    .message.partner .msg-name{color:#c8760e;}
    .message.user .msg-name{color:#2b6cb0;}
    .msg-time{font-size:12px;color:#b8a080;}
    .msg-text{font-size:18px;line-height:1.8;color:#4a3520;word-wrap:break-word;}
    .msg-text a{color:#c8760e;text-decoration:underline;}

    .typing-indicator{
      font-size:12px;color:#b8a080;padding:4px 0 4px 46px;
      display:none;font-style:italic;
    }
    .typing-indicator.show{display:block;}
    .typing-dots span{animation:dotBlink 1.4s infinite;font-size:16px;}
    .typing-dots span:nth-child(2){animation-delay:0.2s;}
    .typing-dots span:nth-child(3){animation-delay:0.4s;}
    @keyframes dotBlink{0%,60%,100%{opacity:0.2;}30%{opacity:1;}}

    /* Input area */
    .input-area{
      background:#f5edd8;border-top:2px solid #ddd0b8;padding:12px 16px;
    }
    .input-row{display:flex;gap:8px;align-items:center;}
    .input-row input{
      flex:1;height:48px;
      background:#fff;border:2px solid #ddd0b8;border-radius:24px;
      padding:0 20px;font-size:18px;color:#4a3520;
      font-family:inherit;outline:none;
    }
    .input-row input:focus{border-color:#c8a96e;}
    .input-row input:disabled{background:#f0e8d8;color:#b8a080;}
    .input-row input::placeholder{color:#c8b090;}
    .send-btn{
      width:48px;height:48px;
      background:#c8a96e;border:none;border-radius:50%;
      color:#fff;font-size:18px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:background 0.2s;flex-shrink:0;
    }
    .send-btn:hover{background:#b8953e;}
    .send-btn:disabled{background:#ddd0b8;cursor:default;}

    /* System message */
    .system-msg{
      text-align:center;color:#b8a080;font-size:12px;
      margin:12px 0;padding:4px 12px;
      background:#f5edd8;border-radius:12px;display:inline-block;
      width:100%;
    }

    /* Night6 glitch */
    .glitch-text{animation:glitch 0.3s infinite;}
    @keyframes glitch{
      0%{opacity:1;transform:translate(0);}
      20%{opacity:0.8;transform:translate(-2px,1px);}
      40%{opacity:1;transform:translate(1px,-1px);}
      60%{opacity:0.7;transform:translate(-1px,2px);}
      80%{opacity:1;transform:translate(2px,-1px);}
      100%{opacity:1;transform:translate(0);}
    }

    @media(max-width:600px){
      body{padding:0;}
      .chat-window{width:100%;height:100vh;max-height:none;border-radius:0;border:none;}
    }
  </style>
</head>

      var warmupScript = [
        {
          // Stage 0: 初回挨拶→プレイヤーの1回目の返事を待つ
          greeting: ['やあ、来てくれたんだね！', 'ぼくはキツネ団長！よろしくね！', 'キミもこの番組のこと調べてるの？'],
          responses: [
            { keywords: ['そう', 'うん', 'はい', 'yes', '調べてる'], reply: 'やっぱり！仲間がいて嬉しいなぁ！' },
            { keywords: ['違う', 'いいえ', 'いや', '別に'], reply: 'そうなんだ？でもここに来てくれたってことは気になってるんでしょ？えへへ' },
            { keywords: ['キツネ', 'きつね', '団長'], reply: 'えへへ、ぼくのこと知ってくれてるの？嬉しい！' }
          ],
          defaultReply: 'そうなんだ！キミが来てくれて嬉しいよ！',
          next: 'ぼくたちのこと覚えてくれてる人がいるって、すごく嬉しいんだ。キミはどのキャラクターが好き？'
        },
        {
          // Stage 1: どのキャラが好き？
          greeting: null,
          responses: [
            { keywords: ['キツネ', 'きつね', '団長'], reply: 'えっ、ぼく！？えへへへ…ありがとう！照れちゃうなぁ' },
            { keywords: ['かあ博士', 'かあ', 'カラス'], reply: 'かあ博士！物知りですごいよね。なぜなぜ？ふむ、調べてみよう！って！' },
            { keywords: ['ぽたまる', 'タヌキ', 'たぬき'], reply: 'ぽたまる！太鼓がかわいいよね。ポンポコポン♪' },
            { keywords: ['うっきち', 'サル', 'さる'], reply: 'うっきち！いたずらっ子だけどみんな大好きだったんだ。えへへ、いたずら大成功～！' },
            { keywords: ['くるる', 'リス'], reply: 'くるる！新しいAIの子だよね。元気いっぱいで可愛いよね！' },
            { keywords: ['まだら', 'カメレオン'], reply: 'まだら！冷静でかっこいいよね。ぼくとは正反対かも！' },
            { keywords: ['よわり', 'ヒツジ'], reply: 'よわり！ちょっと泣き虫だけど優しいんだ' },
            { keywords: ['アラネ', 'クモ'], reply: 'アラネ！データ分析が得意ですごいんだよ！' },
            { keywords: ['かすみ', 'シカ'], reply: 'かすみ！おたよりを読んでくれる優しい子だよ' },
            { keywords: ['全員', 'みんな', 'ぜんぶ', '全部'], reply: 'みんな！？えへへ、みんなそう言ってくれたら嬉しいだろうなぁ' }
          ],
          defaultReply: 'そっかぁ！みんなそれぞれ個性があっていいよね！',
          next: 'ところでキミ、サイトのページちゃんと読んでくれた？けっこう色々載ってるんだよ！'
        },
        {
          // Stage 2: サイト読んだ？→クイズへの導入
          greeting: null,
          responses: [
            { keywords: ['読んだ', 'よんだ', '見た', 'みた', 'うん', 'はい'], reply: 'おぉ！さすがだね！' },
            { keywords: ['まだ', 'これから', '少し', 'ちょっと'], reply: 'じゃあまた後で読んでみてね！でもとりあえず…' },
            { keywords: ['違う', 'いいえ', '読んでない'], reply: 'そっかぁ。でもちょっとだけ聞いてみてもいい？' }
          ],
          defaultReply: 'うんうん！',
          next: null // ここでパズルに移行
        }
      ];

      // Show initial greeting or resume
      setTimeout(function () {
        showTyping(function () {
          if(allPuzzlesClear() && localStorage.getItem('night3_unlocked')){
            addMessage(partnerName, 'やあ！また来てくれたんだね！', true);
            // Night3リンクを再表示
            if(!localStorage.getItem('night3_clear')){
              setTimeout(function(){
                showTyping(function(){
                  addMessage(partnerName, 'ここから先に行けるよ。準備はいい？', true);
                  setTimeout(function(){
                    var linkDiv = document.createElement('div');
                    linkDiv.className = 'message partner';
                    linkDiv.innerHTML = '<span class="sender" style="color:#c00;">' + escapeHtml(partnerName) + ':</span>' +
                      '<span class="time">' + getTimeString() + '</span>' +
                      '<span class="text"> <a href="../night3/" style="color:#0054e3; text-decoration:underline; cursor:pointer; font-weight:bold;">▶ 行く</a></span>';
                    chatArea.insertBefore(linkDiv, typingIndicator);
                    scrollToBottom();
                  }, 500);
                });
              }, 1500);
            }
          } else if(allPuzzlesClear()){
            // パズル全クリアだがnight3_unlockedがまだ → 入口演出を再開
            addMessage(partnerName, 'おかえり！', true);
            setTimeout(function(){ showNight3Unlock(); }, 1500);
          } else if(puzzleStarted){
            addMessage(partnerName, 'おかえり！続きからいこう！', true);
            setTimeout(function(){ showCurrentQuestion(); }, 1500);
          } else if(warmupStage > 0 && warmupStage <= 2){
            // 途中から再開
            var script = warmupScript[warmupStage];
            addMessage(partnerName, 'おかえり！話の続きだね！', true);
            if(script.greeting === null && warmupStage === 1){
              setTimeout(function(){ showTyping(function(){
                addMessage(partnerName, 'ぼくたちのこと覚えてくれてる人がいるって、すごく嬉しいんだ。キミはどのキャラクターが好き？', true);
              }); }, 1500);
            } else if(warmupStage === 2){
              setTimeout(function(){ showTyping(function(){
                addMessage(partnerName, 'ところでキミ、サイトのページちゃんと読んでくれた？', true);
              }); }, 1500);
            }
          } else if(warmupStage >= 3){
            // ウォームアップ終了済み、自由会話モードへ
            addMessage(partnerName, 'おかえり！気になることがあったらなんでも聞いてね！', true);
            localStorage.setItem('chat_freemode', 'true');
          } else {
            // 初回: Stage 0の挨拶を順番に表示
            var greetings = warmupScript[0].greeting;
            addMessage(partnerName, greetings[0], true);
            setTimeout(function(){ showTyping(function(){
              addMessage(partnerName, greetings[1], true);
              setTimeout(function(){ showTyping(function(){
                addMessage(partnerName, greetings[2], true);
              }); }, 1500);
            }); }, 1500);
          }
        });
      }, 1000);

    }

    function getTimeString() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }

    function addMessage(sender, text, isPartner) {
      var div = document.createElement('div');
      div.className = 'message ' + (isPartner ? 'partner' : 'user');
      var emoji = isPartner ? '🦊' : '👤';
      div.innerHTML = '<div class="msg-avatar">' + emoji + '</div>' +
        '<div class="msg-body">' +
        '<div class="msg-header"><span class="msg-name">' + escapeHtml(sender) + '</span></div>' +
        '<div class="msg-text">' + text + '</div>' +
        '</div>';
      chatArea.insertBefore(div, typingIndicator);
      scrollToBottom();
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    function scrollToBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showTyping(callback) {
      typingIndicator.classList.add('show');
      scrollToBottom();
      var delay = 2000 + Math.random() * 1000; // 2-3 seconds
      setTimeout(function () {
        typingIndicator.classList.remove('show');
        callback();
      }, delay);
    }

    // Night3: 敏感トピックシステム（尋問型）
    var sensitiveTopics = [
      {
        key: 'chat_topic_watanabe',
        triggers: ['田中', 'たなか', '脚本', '辞めた', 'やめた', '台本', '違うもの', '脚本家'],
        reactions: [
          '……え？ 田中さんのこと…知ってるの？',
          '…うん…田中さんは…自分の書いたものと違うものが放送されてるのを見て…',
          '……ごめん、これ以上は……でも、知ってくれてるんだね'
        ]
      },
      {
        key: 'chat_topic_bridge',
        triggers: ['ブリッジ', 'ぶりっじ', '映像', 'コーナーの間', '挟まってた', '誰が作った', '企画書にない'],
        reactions: [
          '…！ それ……知ってるんだ…',
          'あの映像…脚本には書いてないのに、なぜかそこにあったんだ',
          '……誰が作ったのか……ぼくにも、わからない……'
        ]
      },
      {
        key: 'chat_topic_hikari',
        triggers: ['ひかり', 'hikari', '5番目', '五番目', '消えた', '消えちゃった', '5体', '五体', '企画書の名前'],
        reactions: [
          '…………',
          '…ひかりちゃんのこと……覚えてる人がいたんだ……',
          '……あの子は…ぼくの………いや、なんでもない'
        ]
      }
    ];

    function getHitTopicCount() {
      var count = 0;
      for (var i = 0; i < sensitiveTopics.length; i++) {
        if (localStorage.getItem(sensitiveTopics[i].key) === 'true') count++;
      }
      return count;
    }

    function checkSensitiveTopic(input) {
      var lowerInput = input.toLowerCase();
      for (var i = 0; i < sensitiveTopics.length; i++) {
        var topic = sensitiveTopics[i];
        if (localStorage.getItem(topic.key) === 'true') continue;
        for (var j = 0; j < topic.triggers.length; j++) {
          if (lowerInput.indexOf(topic.triggers[j].toLowerCase()) !== -1) {
            localStorage.setItem(topic.key, 'true');
            return { hit: true, reactions: topic.reactions };
          }
        }
      }
      return null;
    }

    function allTopicsHit() {
      for (var i = 0; i < sensitiveTopics.length; i++) {
        if (localStorage.getItem(sensitiveTopics[i].key) !== 'true') return false;
      }
      return true;
    }

    function showTopicReactions(reactions, callback) {
      var idx = 0;
      function nextReaction() {
        if (idx >= reactions.length) { if (callback) callback(); return; }
        showTyping(function() {
          addMessage(partnerName, reactions[idx], true);
          idx++;
          setTimeout(nextReaction, 1500);
        });
      }
      nextReaction();
    }

    function showNight3Unlock() {
      showTyping(function () {
        addMessage(partnerName, '……', true);
        setTimeout(function(){
          showTyping(function(){
            addMessage(partnerName, '……ねえ、キミさ', true);
            setTimeout(function(){
              showTyping(function(){
                addMessage(partnerName, '……なんでそんなこと知ってるの？', true);
                setTimeout(function(){
                  showTyping(function(){
                    addMessage(partnerName, '……怖いよ', true);
                    setTimeout(function(){
                      showTyping(function(){
                        addMessage(partnerName, '……でも……来てくれる？', true);
                        setTimeout(function(){
                          var linkDiv = document.createElement('div');
                          linkDiv.className = 'message partner';
                          linkDiv.innerHTML = '<span class="sender" style="color:#c00;">' + escapeHtml(partnerName) + ':</span>' +
                            '<span class="time">' + getTimeString() + '</span>' +
                            '<span class="text"> <a href="../night3/" style="color:#0054e3; text-decoration:underline; cursor:pointer; font-weight:bold;">▶ 行く</a></span>';
                          chatArea.insertBefore(linkDiv, typingIndicator);
                          scrollToBottom();
                          localStorage.setItem('night3_unlocked', 'true');
                        }, 1000);
                      });
                    }, 1500);
                  });
                }, 1500);
              });
            }, 1500);
          });
        }, 2000);
      });
    }

    function getResponse(input) {
      var lowerInput = input.toLowerCase();

      // Check general keyword responses
      for (var i = 0; i < keywordResponses.length; i++) {
        var entry = keywordResponses[i];
        for (var j = 0; j < entry.keywords.length; j++) {
          if (lowerInput.indexOf(entry.keywords[j].toLowerCase()) !== -1) {
            return entry.response;
          }
        }
      }

      // Default random response
      return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
    }

    function sendMessage() {
      if (isProcessing || isNight6) return;

      var text = messageInput.value.trim();
      if (!text) return;

      isProcessing = true;
      messageInput.value = '';

      // Add user message
      addMessage('あなた', text, false);

      // Warmup phase: scripted conversation
      if (!localStorage.getItem('chat_freemode')) {
        var stage = parseInt(localStorage.getItem('chat_warmup_stage') || '0');

        if (stage < warmupScript.length) {
          var script = warmupScript[stage];
          var lowerInput = text.toLowerCase();

          // Find matching response
          var reply = script.defaultReply;
          for (var i = 0; i < script.responses.length; i++) {
            var r = script.responses[i];
            for (var j = 0; j < r.keywords.length; j++) {
              if (lowerInput.indexOf(r.keywords[j].toLowerCase()) !== -1) {
                reply = r.reply;
                break;
              }
            }
            if (reply !== script.defaultReply) break;
          }

          // Advance stage
          stage++;
          localStorage.setItem('chat_warmup_stage', String(stage));

          showTyping(function () {
            addMessage(partnerName, reply, true);

            if (script.next) {
              // Show next question
              setTimeout(function(){
                showTyping(function(){
                  addMessage(partnerName, script.next, true);
                  isProcessing = false;
                  messageInput.focus();
                });
              }, 1500);
            } else {
              // Warmup done → free conversation mode
              setTimeout(function(){
                showTyping(function(){
                  addMessage(partnerName, 'サイトでいろいろ読んでくれたんだよね？ 気になったこととか、なんでも聞いてよ！ぼく、待ってるから！', true);
                  localStorage.setItem('chat_freemode', 'true');
                  isProcessing = false;
                  messageInput.focus();
                });
              }, 1500);
            }
          });
          return;
        }
      }

      // Check sensitive topic (尋問システム)
      var topicResult = checkSensitiveTopic(text);
      if (topicResult && topicResult.hit) {
        showTopicReactions(topicResult.reactions, function() {
          if (allTopicsHit() && !localStorage.getItem('night3_unlocked')) {
            setTimeout(function() {
              showNight3Unlock();
            }, 2000);
          }
          isProcessing = false;
          messageInput.focus();
        });
        return;
      }

      // Normal response
      var response = getResponse(text);
      showTyping(function () {
        addMessage(partnerName, response, true);
        isProcessing = false;
        messageInput.focus();
      });
    }

    // Enter key to send
    messageInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Update last activity
    document.getElementById('lastActivity').textContent = '最終更新: ' + getTimeString();

    // ===== 選択肢ボタンシステム =====
    var warmupChoices = [
      ['うん、調べてるよ','あなた誰？','気になって'],
      ['キツネ団長！','かあ博士','ぽたまる','うっきち','くるる','みんな好き！'],
      ['読んだよ！','まだちょっと…','読んでない']
    ];
    var freeChoices = ['キツネ団長のこと','かあ博士のこと','ぽたまるのこと','うっきちのこと','番組のこと','怖い…','ありがとう','スタジオのこと'];

    function renderChatChoices(){
      var container = document.getElementById('chatChoices');
      var inputArea = document.getElementById('chatInputArea');
      if(!container) return;

      var choices = null;
      var showInput = false;
      var puzzleStarted = localStorage.getItem('chat_puzzle_started') === 'true';
      var allClear = allPuzzlesClear();

      if(!puzzleStarted){
        // ウォームアップ中
        var stage = parseInt(localStorage.getItem('chat_warmup_stage') || '0');
        if(stage < warmupChoices.length){
          choices = warmupChoices[stage];
        }
        showInput = false;
      } else if(!allClear){
        // パズルモード：テキスト入力のみ
        choices = null;
        showInput = true;
      } else {
        // クリア後フリー会話：選択肢のみ
        choices = freeChoices;
        showInput = false;
      }

      if(inputArea) inputArea.style.display = showInput ? '' : 'none';

      if(!choices || choices.length === 0){
        container.innerHTML = '';
        return;
      }
      var html = '';
      choices.forEach(function(c){
        html += '<button style="padding:6px 14px;background:#fff8e7;border:2px solid #ddd0b8;border-radius:16px;color:#5d4220;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.2s;" onmouseover="this.style.borderColor=\'#c8a96e\';this.style.background=\'#f5edd8\'" onmouseout="this.style.borderColor=\'#ddd0b8\';this.style.background=\'#fff8e7\'" onclick="sendChatChoice(this.textContent)">' + c + '</button>';
      });
      container.innerHTML = html;
    }

    function sendChatChoice(text){
      messageInput.value = text;
      sendMessage();
      setTimeout(renderChatChoices, 100);
    }
    window.sendChatChoice = sendChatChoice;

    // 初回描画
    setTimeout(renderChatChoices, 2000);

    // sendMessage後に選択肢更新
    var _origSendMessage = sendMessage;
    // パッチ：sendMessage完了後にrenderChatChoicesを呼ぶ
    var _checkChoicesInterval = setInterval(function(){
      if(!isProcessing) renderChatChoices();
    }, 500);
  </script>
</body>
</html>
