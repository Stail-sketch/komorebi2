<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popin - ポピン</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0f;color:#e8e0f0;font-family:'Segoe UI','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;font-size:15px;line-height:1.6;overflow-x:hidden;}
a{color:#FF6B6B;text-decoration:none;}
a:hover{color:#FF7EB3;}

/* Top Navigation Bar */
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.95);backdrop-filter:blur(16px);border-bottom:2px solid #2a1530;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.topbar::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:3px;background:linear-gradient(90deg,#FF7EB3,#FFE66D,#88D8B0,#FF7EB3);opacity:0.4;}
.topbar-left{display:flex;align-items:center;gap:28px;}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#FF6B6B;cursor:pointer;}
.brand-bubble{width:36px;height:36px;background:linear-gradient(135deg,#FF6B6B,#FF7EB3);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 10px rgba(255,107,107,.3);}
.brand-bubble::after{content:'';position:absolute;bottom:-3px;left:5px;width:10px;height:10px;background:#FF7EB3;clip-path:polygon(50% 100%,0 0,100% 0);border-radius:0 0 2px 2px;}
.brand-bubble-dot{width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 0 6px rgba(255,255,255,.8);}
.brand span{background:linear-gradient(135deg,#FF6B6B,#FF7EB3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.topbar-nav{display:flex;gap:4px;}
.topbar-nav a{padding:8px 18px;border-radius:20px;font-size:14px;font-weight:600;color:#b0a0b8;transition:all .2s;}
.topbar-nav a:hover{background:rgba(255,107,107,.08);color:#FF6B6B;}
.topbar-nav a.active{background:rgba(255,107,107,.12);color:#FF6B6B;}
.topbar-right{display:flex;align-items:center;gap:12px;}
.search-box{background:#1a1520;border-radius:24px;padding:8px 16px;display:flex;align-items:center;gap:8px;border:2px solid #2a1530;transition:border-color .2s;width:220px;}
.search-box:focus-within{border-color:#FF7EB3;}
.search-box svg{width:16px;height:16px;fill:#d4b0c0;flex-shrink:0;}
.search-box input{background:transparent;border:none;outline:none;color:#e8e0f0;font-size:13px;width:100%;}
.search-box input::placeholder{color:#d4b0c0;}

/* Page Layout */
.page{max-width:600px;margin:0 auto;padding:20px 16px 40px;}

/* Post Composer */
.composer{background:#fff;border-radius:24px;padding:18px 20px;margin-bottom:20px;box-shadow:0 2px 12px rgba(255,126,179,.08);border:2px solid #ffe8ee;}
.composer-inner{display:flex;gap:12px;align-items:flex-start;}
.composer-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FFE66D,#FF7EB3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.composer-input{flex:1;display:flex;flex-direction:column;gap:10px;}
.composer-input textarea{width:100%;border:none;outline:none;resize:none;font-size:15px;font-family:inherit;color:#3d3247;background:transparent;min-height:44px;line-height:1.5;}
.composer-input textarea::placeholder{color:#d4b0c0;}
.composer-bottom{display:flex;justify-content:flex-end;align-items:center;gap:10px;}
.composer-btn{background:linear-gradient(135deg,#FF6B6B,#FF7EB3);color:#fff;border:none;border-radius:24px;padding:8px 24px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(255,107,107,.25);font-family:inherit;}
.composer-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(255,107,107,.35);}

/* Trending strip */
.trending-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 0 20px;scrollbar-width:none;-ms-overflow-style:none;}
.trending-strip::-webkit-scrollbar{display:none;}
.trending-chip{flex-shrink:0;background:#141018;border:2px solid #2a1530;border-radius:24px;padding:8px 18px;font-size:13px;font-weight:600;color:#FF6B6B;cursor:pointer;transition:all .2s;white-space:nowrap;}
.trending-chip:nth-child(2){border-color:#2a2015;color:#e8a040;}
.trending-chip:nth-child(3){border-color:#152a1a;color:#4dba7a;}
.trending-chip:nth-child(4){border-color:#d8d0f8;color:#8b6ec0;background:#faf8ff;}
.trending-chip:hover{transform:translateY(-2px);border-color:#FF7EB3;}
.trending-chip .chip-count{font-weight:400;color:#605068;margin-left:6px;font-size:12px;}

/* Post Card */
.post-card{background:#141018;border:1px solid #2a2035;border-radius:24px;padding:18px 20px;margin-bottom:14px;transition:all .25s;cursor:pointer;}
.post-card:hover{transform:translateY(-2px);border-color:#FF7EB3;box-shadow:0 4px 20px rgba(255,126,179,.1);}
.post-top{display:flex;align-items:flex-start;gap:12px;}
.avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;transition:transform .2s;}
.avatar:hover{transform:scale(1.1);}
.post-meta{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;}
.post-author{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;}
.post-name{font-weight:700;font-size:17px;white-space:nowrap;color:#f0e8f8;cursor:pointer;}
.post-name:hover{text-decoration:underline;}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex-shrink:0;}
.post-handle{color:#8070a0;font-size:14px;white-space:nowrap;cursor:pointer;}
.post-handle:hover{text-decoration:underline;}
.post-time{color:#8070a0;font-size:14px;white-space:nowrap;flex-shrink:0;}
.post-text{margin-top:10px;margin-left:56px;word-break:break-word;white-space:pre-wrap;font-size:17px;line-height:1.7;color:#e0d8ee;}
.post-actions{display:flex;gap:12px;margin-top:14px;margin-left:56px;}
.post-actions span{display:flex;align-items:center;gap:6px;font-size:16px;color:#8070a0;cursor:pointer;padding:8px 18px;border-radius:24px;transition:all .2s;font-weight:500;border:1px solid #2a2035;}
.post-actions span:hover{background:rgba(255,107,107,.12);color:#FF6B6B;border-color:#FF6B6B;}
.action-heart:hover{background:rgba(255,107,107,.15) !important;color:#FF6B6B !important;border-color:#FF6B6B !important;}

/* Back button */
.back-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;margin-bottom:16px;border:1px solid #2a2035;background:#141018;border-radius:24px;font-size:15px;font-weight:600;color:#FF6B6B;cursor:pointer;transition:all .2s;font-family:inherit;}
.back-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(255,107,107,.15);background:#fff5f7;}
.back-btn svg{width:18px;height:18px;fill:#FF6B6B;}

/* Post Detail View */
.detail-original{background:#141018;border:1px solid #2a2035;border-radius:24px;padding:22px 24px;margin-bottom:4px;}
.detail-original .post-text{font-size:19px;line-height:1.8;}
.replies-divider{display:flex;align-items:center;gap:12px;padding:16px 0;color:#8070a0;font-size:14px;font-weight:600;}
.replies-divider::before,.replies-divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#2a2035,transparent);}
.reply-card{background:#141018;border:1px solid #2a2035;border-radius:20px;padding:14px 18px;margin-bottom:10px;margin-left:24px;border-left:3px solid #FF7EB3;transition:all .2s;}
.reply-card:hover{border-color:#FF7EB3;}
.reply-card .post-text{font-size:16px;margin-left:48px;}
.reply-card .avatar{width:36px;height:36px;font-size:13px;}
.reply-card .post-name{font-size:14px;}
.reply-card .post-handle{font-size:12px;}
.no-replies{text-align:center;padding:24px;color:#8070a0;font-size:14px;}

/* Profile View */
.profile-header{background:#141018;border:1px solid #2a2035;border-radius:24px;padding:28px 24px;margin-bottom:20px;text-align:center;}
.profile-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;margin:0 auto 14px;box-shadow:0 4px 16px rgba(0,0,0,.1);}
.profile-name{font-size:22px;font-weight:800;color:#f0e8f8;display:flex;align-items:center;justify-content:center;gap:6px;}
.profile-handle{color:#8070a0;font-size:14px;margin-top:2px;}
.profile-bio{margin-top:12px;font-size:14px;color:#c0b8d0;line-height:1.6;max-width:400px;margin-left:auto;margin-right:auto;}
.profile-info{display:flex;justify-content:center;gap:24px;margin-top:16px;font-size:13px;color:#c0a8b4;}
.profile-info strong{color:#3d3247;font-weight:700;}
.profile-joined{margin-top:8px;font-size:13px;color:#c0a8b4;display:flex;align-items:center;justify-content:center;gap:4px;}
.profile-posts-label{font-size:16px;font-weight:700;color:#f0e8f8;margin-bottom:14px;padding-left:4px;}

/* View transitions */
.view{display:none;}
.view.active{display:block;}

/* Glitch effects */
.glitch-text{font-family:monospace;color:#ff0033;animation:glitchFlicker 0.3s infinite alternate;}
@keyframes glitchFlicker{0%{opacity:1;text-shadow:2px 0 #0ff,-2px 0 #f0f;}50%{opacity:0.8;text-shadow:-2px 0 #0ff,2px 0 #f0f;}100%{opacity:1;text-shadow:1px 0 #ff0,-1px 0 #0f0;}}
.glitch-avatar{animation:avatarGlitch 1.5s infinite;background:#330000 !important;box-shadow:0 0 12px rgba(255,0,0,.3) !important;}
@keyframes avatarGlitch{0%,100%{transform:translate(0);filter:none;}25%{transform:translate(-2px,1px);filter:hue-rotate(90deg);}50%{transform:translate(1px,-1px);filter:brightness(2);}75%{transform:translate(-1px,2px);filter:hue-rotate(180deg);}
}
.night6-override{background:#1a0008 !important;}
.night6-override .topbar{background:rgba(26,0,8,.95) !important;border-bottom-color:rgba(255,0,0,.2) !important;}
.night6-override .topbar::after{background:linear-gradient(90deg,#ff0033,#330000,#ff0033) !important;opacity:1 !important;}
.night6-override .brand span{background:linear-gradient(135deg,#ff0033,#660000) !important;-webkit-background-clip:text !important;background-clip:text !important;}
.night6-override .post-card,.night6-override .detail-original,.night6-override .reply-card{background:rgba(40,0,10,.9) !important;box-shadow:0 0 20px rgba(255,0,0,.05) !important;}
.night6-override .post-text{color:#ff0033 !important;}
.night6-override .post-name{color:#ff3355 !important;}
.night6-override .post-handle,.night6-override .post-time,.night6-override .post-actions span{color:#660022 !important;}
.night6-override .composer{background:rgba(40,0,10,.9) !important;border-color:rgba(255,0,0,.2) !important;}
.night6-override .trending-chip{background:rgba(40,0,10,.9) !important;border-color:rgba(255,0,0,.2) !important;color:#ff0033 !important;}
.night6-override .trending-chip .chip-count{color:#660022 !important;}
.night6-override .back-btn{background:rgba(40,0,10,.9) !important;color:#ff0033 !important;box-shadow:0 0 10px rgba(255,0,0,.1) !important;}
.night6-override .back-btn svg{fill:#ff0033 !important;}
.night6-override .profile-header{background:rgba(40,0,10,.9) !important;box-shadow:0 0 20px rgba(255,0,0,.05) !important;}
.night6-override .profile-name,.night6-override .profile-posts-label,.night6-override .profile-info strong{color:#ff3355 !important;}
.night6-override .profile-handle,.night6-override .profile-bio,.night6-override .profile-joined,.night6-override .profile-info,.night6-override .replies-divider,.night6-override .no-replies{color:#660022 !important;}
.night6-override .replies-divider::before,.night6-override .replies-divider::after{background:linear-gradient(90deg,transparent,rgba(255,0,0,.2),transparent) !important;}
.night6-override .reply-card{border-left-color:rgba(255,0,0,.2) !important;}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:2px solid #ffe0e6;display:flex;justify-content:center;gap:0;z-index:100;padding:0;height:56px;}
.bottom-nav a{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:#c0a8b4;text-decoration:none;transition:color .2s;padding:6px 0;}
.bottom-nav a.active{color:#FF6B6B;}
.bottom-nav a .nav-icon{font-size:22px;line-height:1;}

/* Night6 bottom nav override */
.night6-override .bottom-nav{background:rgba(26,0,8,.95) !important;border-top-color:rgba(255,0,0,.2) !important;}
.night6-override .bottom-nav a{color:#660022 !important;}
.night6-override .bottom-nav a.active{color:#ff0033 !important;}

/* DM View */
.dm-container{display:flex;flex-direction:column;height:calc(100vh - 120px);}
.dm-header{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid #2a1530;}
.dm-header-avatar{width:40px;height:40px;border-radius:50%;background:#e8945a;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;}
.dm-header-name{font-weight:700;font-size:16px;color:#f0e8f8;}
.dm-header-handle{font-size:13px;color:#8070a0;}
.dm-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;}
.dm-bubble{max-width:75%;padding:10px 16px;border-radius:18px;margin-bottom:8px;font-size:15px;line-height:1.6;word-break:break-word;white-space:pre-wrap;}
.dm-bubble-left{background:#1a1520;color:#e8e0f0;align-self:flex-start;border-bottom-left-radius:4px;}
.dm-bubble-right{background:linear-gradient(135deg,#FF6B6B,#FF7EB3);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.dm-typing{color:#8070a0;font-size:13px;padding:8px 16px;font-style:italic;align-self:flex-start;}
.dm-choices{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:2px solid #2a1530;}
.dm-choice-btn{padding:8px 16px;background:#1a1520;border:1px solid #2a1530;border-radius:16px;color:#e8e0f0;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.dm-choice-btn:hover{border-color:#FF7EB3;color:#FF7EB3;}

/* DM Button */
.dm-btn{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#1a1520;border:2px solid #2a1530;cursor:pointer;transition:all .2s;}
.dm-btn:hover{border-color:#FF7EB3;background:rgba(255,107,107,.08);}
.dm-btn svg{width:20px;height:20px;fill:#e8e0f0;}
.dm-badge{position:absolute;top:-4px;right:-4px;width:18px;height:18px;background:#FF6B6B;border-radius:50%;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(255,107,107,.4);animation:dmBadgePulse 2s infinite;}
@keyframes dmBadgePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

/* Night6 DM overrides */
.night6-override .dm-container{color:#660022;}
.night6-override .dm-bubble-left{background:rgba(40,0,10,.9);color:#ff0033;}
.night6-override .dm-header{border-bottom-color:rgba(255,0,0,.2);}
.night6-override .dm-choices{border-top-color:rgba(255,0,0,.2);}
.night6-override .dm-btn{background:rgba(40,0,10,.9);border-color:rgba(255,0,0,.2);}
.night6-override .dm-btn svg{fill:#ff0033;}
.night6-override .dm-typing,.night6-override .dm-header-handle{color:#660022;}
.night6-override .dm-header-name{color:#ff3355;}

/* Responsive */
@media(max-width:768px){
  .topbar-nav{display:none;}
  .search-box{width:160px;}
  .page{padding:16px 10px 100px;}
  .post-card,.detail-original{padding:14px 16px;}
  .post-text{margin-left:0;margin-top:10px;}
  .post-actions{margin-left:0;}
  .reply-card{margin-left:12px;}
  .reply-card .post-text{margin-left:0;}
}
@media(max-width:480px){
  .search-box{display:none;}
  .topbar{padding:0 14px;}
}
</style>
</head>

// Generate timestamp text based on phase difference from current highest cleared night
function getTimeText(phase, indexInPhase, totalInPhase){
  var diff = highestCleared - phase;
  if(diff < 0) diff = 0;
  // Spread within each phase using indexInPhase
  var t = totalInPhase > 1 ? indexInPhase / (totalInPhase - 1) : 0; // 0..1

  if(diff === 0){
    // Latest phase: 数分前 range (2分前 ~ 45分前)
    var mins = [2, 5, 8, 12, 18, 22, 28, 35, 40, 45];
    return mins[Math.min(indexInPhase, mins.length-1)] + '分前';
  } else if(diff === 1){
    // One phase older: 1時間前 range
    var opts = ['1時間前','1時間前','1時間半前','1時間半前','1時間前','1時間半前'];
    return opts[indexInPhase % opts.length];
  } else if(diff === 2){
    // Two phases older: 2〜3時間前
    var opts2 = ['2時間前','2時間前','3時間前','2時間半前','3時間前','2時間前','3時間前'];
    return opts2[indexInPhase % opts2.length];
  } else if(diff === 3){
    // Three phases older: 4〜5時間前
    var opts3 = ['4時間前','4時間前','5時間前','4時間半前','5時間前','4時間前','5時間前'];
    return opts3[indexInPhase % opts3.length];
  } else if(diff === 4){
    // Four phases older: 6〜8時間前
    var opts4 = ['6時間前','7時間前','8時間前','6時間半前','7時間前','8時間前'];
    return opts4[indexInPhase % opts4.length];
  } else {
    // Five+ phases older: 10〜12時間前
    var opts5 = ['10時間前','11時間前','12時間前','10時間半前','11時間前','12時間前'];
    return opts5[indexInPhase % opts5.length];
  }
}

(function(){
  var phaseCounts = {};

  // First pass: count posts per phase
  posts.forEach(function(p){
    var ph = p.phase !== undefined ? p.phase : 0;
    phaseCounts[ph] = (phaseCounts[ph] || 0) + 1;
    phaseIndexes[ph] = 0;
  });
  // Second pass: assign index within phase and compute time text
  posts.forEach(function(p){
    var ph = p.phase !== undefined ? p.phase : 0;
    var idx = phaseIndexes[ph];
    var total = phaseCounts[ph];
    p.time = getTimeText(ph, idx, total);
    phaseIndexes[ph] = idx + 1;
  });
})();

function renderPostCard(p, idx, options){
  var acc=ACCOUNTS[p.account];
  if(!acc) return '';
  var isGlitch=acc.glitch;
  var avatarClass='avatar'+(isGlitch?' glitch-avatar':'');
  var contentClass='post-text'+(isGlitch?' glitch-text':'');
  var cardClass=options&&options.cardClass?options.cardClass:'post-card';
  var clickable=options&&options.noClick?'':'data-post-idx="'+idx+'"';
  var avatarClick='onclick="event.stopPropagation();showProfile(\''+p.account+'\')"';
  var nameClick='onclick="event.stopPropagation();showProfile(\''+p.account+'\')"';

  var h='<article class="'+cardClass+'" '+clickable+'>';
  h+='<div class="post-top">';
  h+='<div class="'+avatarClass+'" style="background:'+acc.color+'" '+avatarClick+'>'+acc.initial+'</div>';
  h+='<div class="post-meta">';
  h+='<div class="post-author">';
  h+='<span class="post-name" '+nameClick+'>'+acc.name+'</span>';
  if(acc.verified) h+=BADGE_SVG;
  h+='<span class="post-handle" '+nameClick+'>'+acc.handle+'</span>';
  h+='</div>';
  h+='<span class="post-time">'+p.time+'</span>';
  h+='</div>';
  h+='</div>';
  h+='<div class="'+contentClass+'">'+p.text+'</div>';
  h+='<div class="post-actions">';
  h+='<span class="action-heart">\u2661 '+p._hearts+'</span>';
  h+='<span>\ud83d\udcac '+p._replyCount+'</span>';
  h+='</div>';
  h+='</article>';
  return h;
}

// Click handler for post cards (open detail)
timeline.addEventListener('click',function(e){
  var card=e.target.closest('[data-post-idx]');
  if(!card) return;
  var idx=parseInt(card.getAttribute('data-post-idx'),10);
  showPostDetail(idx);
});

// ===== VIEW SWITCHING =====
var viewTimeline=document.getElementById('view-timeline');
var viewPostDetail=document.getElementById('view-post-detail');
var viewProfile=document.getElementById('view-profile');
var viewDM=document.getElementById('view-dm');
function switchView(viewEl){
  viewTimeline.classList.remove('active');
  viewPostDetail.classList.remove('active');
  viewProfile.classList.remove('active');
  viewDM.classList.remove('active');
  viewEl.classList.add('active');
  window.scrollTo(0,0);
}

// ブラウザ戻るボタン対応
window.addEventListener('popstate', function(e){
  if(e.state && e.state.view === 'post'){
    _showPostDetail(e.state.idx, true);
  } else if(e.state && e.state.view === 'profile'){
    _showProfile(e.state.key, true);
  } else if(e.state && e.state.view === 'dm'){
    _showDM(true);
  } else {
    switchView(viewTimeline);
  }
});

// Expose to global for onclick handlers
window.showTimeline=function(){
  history.pushState({view:'timeline'}, '', '');
  switchView(viewTimeline);
};

function _showPostDetail(idx, noPush){
  var p=posts[idx];
  if(!p) return;
  var h='<button class="back-btn" onclick="history.back()">'+BACK_SVG+' 戻る</button>';
  h+=renderPostCard(p,idx,{cardClass:'detail-original',noClick:true});

  var replies=p.replies||[];
  if(replies.length>0){
    h+='<div class="replies-divider">返信 '+replies.length+'件</div>';
    replies.forEach(function(r){
      h+=renderReplyCard(r);
    });
  } else {
    h+='<div class="no-replies">返信はまだありません</div>';
  }

  // Hint about date matching investigation records
  if(p.account==='yoshi' && p.phase===1){
    h+='<div class="evidence-hint" style="font-size:11px;color:#605068;margin-top:8px;margin-left:56px;">投稿日時と調査記録の日付が一致している</div>';
  }

  viewPostDetail.innerHTML=h;
  switchView(viewPostDetail);
}

window.showPostDetail=function(idx){
  history.pushState({view:'post', idx:idx}, '', '');
  _showPostDetail(idx);
};

function _showProfile(accountKey, noPush){
  var acc=ACCOUNTS[accountKey];
  if(!acc) return;
  var isGlitch=acc.glitch;

  // Header
  var avatarClass='profile-avatar'+(isGlitch?' glitch-avatar':'');
  var h='<button class="back-btn" onclick="history.back()">'+BACK_SVG+' 戻る</button>';
  h+='<div class="profile-header">';
  h+='<div class="'+avatarClass+'" style="background:'+acc.color+'">'+acc.initial+'</div>';
  h+='<div class="profile-name">'+acc.name;
  if(acc.verified) h+=' '+BADGE_SVG;
  h+='</div>';
  h+='<div class="profile-handle">'+acc.handle+'</div>';
  h+='<div class="profile-bio">'+(acc.bio||'')+'</div>';

  // Count posts
  var userPosts=[];
  posts.forEach(function(p,i){if(p.account===accountKey)userPosts.push({post:p,idx:i});});

  h+='<div class="profile-info"><span><strong>'+userPosts.length+'</strong> ポスト</span></div>';
  h+='<div class="profile-joined">\ud83d\udcc5 '+acc.joined+' から利用</div>';
  h+='</div>';

  // User's posts
  if(userPosts.length>0){
    h+='<div class="profile-posts-label">ポスト</div>';
    userPosts.forEach(function(item){
      h+=renderPostCard(item.post,item.idx);
    });
  }

  viewProfile.innerHTML=h;
  switchView(viewProfile);

  // Attach click for post cards inside profile
  viewProfile.addEventListener('click',function handler(e){
    var card=e.target.closest('[data-post-idx]');
    if(!card) return;
    var idx=parseInt(card.getAttribute('data-post-idx'),10);
    viewProfile.removeEventListener('click',handler);
    showPostDetail(idx);
  });
}

window.showProfile=function(accountKey){
  history.pushState({view:'profile', key:accountKey}, '', '');
  _showProfile(accountKey);
};

// ===== DM SYSTEM =====

function getDMPhase(){
  for(var i=DM_PHASES.length-1;i>=0;i--){
    if(DM_PHASES[i].require()) return DM_PHASES[i];
  }
  return null;
}

function getCompletedPhase(){
  for(var i=DM_PHASES.length-1;i>=0;i--){
    if(hasFlag('dm_phase_'+DM_PHASES[i].id+'_complete')) return DM_PHASES[i].id;
  }
  return 0;
}

function getDMProgress(){
  var phase=getDMPhase();
  if(!phase) return null;
  var completed=getCompletedPhase();
  if(phase.id<=completed) return null;
  return phase;
}

function initDMButton(){
  var phase=getDMProgress();
  if(phase){
    dmBtn.style.display='flex';
    var read=hasFlag('dm_phase_'+phase.id+'_read');
    dmBadge.style.display=read?'none':'flex';
  } else if(getCompletedPhase()>0){
    dmBtn.style.display='flex';
    dmBadge.style.display='none';
  } else {
    dmBtn.style.display='none';
  }
}
initDMButton();

function renderDMMessages(phase, step){
  var script=phase.script;
  var h='<div class="dm-container">';
  h+='<div class="dm-header">';
  h+='<div class="dm-header-avatar">夕</div>';
  h+='<div><div class="dm-header-name">ゆうやけさんぽ</div><div class="dm-header-handle">@yuuyake_sanpo</div></div>';
  h+='</div>';
  h+='<div class="dm-messages" id="dm-msg-area">';

  for(var i=0;i<step && i<script.length;i++){
    var s=script[i];
    if(s.from){
      h+='<div class="dm-bubble dm-bubble-left">'+s.text.replace(/\n/g,'<br>')+'</div>';
    } else if(s.choices && i<step-1){
      var chosen=localStorage.getItem('dm_p'+phase.id+'_c'+i);
      if(chosen) h+='<div class="dm-bubble dm-bubble-right">'+chosen+'</div>';
    }
  }

  if(step<script.length){
    var current=script[step];
    if(current.from){
      h+='<div class="dm-typing">入力中…</div>';
    }
  }

  h+='</div>';

  if(step<script.length && script[step].choices){
    h+='<div class="dm-choices">';
    script[step].choices.forEach(function(c,ci){
      h+='<button class="dm-choice-btn" onclick="chooseDM('+phase.id+','+step+','+ci+')">'+c+'</button>';
    });
    h+='</div>';
  } else if(step>=script.length){
    h+='<div class="dm-choices" style="justify-content:center;color:#8070a0;font-size:13px;">会話は終了しました</div>';
  }

  h+='</div>';
  return h;
}

function _showDM(noPush){
  var phase=getDMPhase();
  var completed=getCompletedPhase();

  if(!phase && completed>0){
    phase=DM_PHASES[completed-1];
    var step=phase.script.length;
    viewDM.innerHTML=renderDMMessages(phase,step);
    switchView(viewDM);
    scrollDMBottom();
    return;
  }
  if(!phase) return;

  localStorage.setItem('dm_phase_'+phase.id+'_read','true');
  dmBadge.style.display='none';

  var step=parseInt(localStorage.getItem('dm_step_'+phase.id)||'0',10);
  viewDM.innerHTML=renderDMMessages(phase,step);
  switchView(viewDM);

  if(step<phase.script.length && phase.script[step].from){
    setTimeout(function(){advanceDM(phase.id);},1200);
  }
  scrollDMBottom();
}

window.showDM=function(){
  history.pushState({view:'dm'},'','');
  _showDM();
};

window.chooseDM=function(phaseId,step,choiceIdx){
  var phase=null;
  for(var i=0;i<DM_PHASES.length;i++){if(DM_PHASES[i].id===phaseId){phase=DM_PHASES[i];break;}}
  if(!phase) return;
  var chosen=phase.script[step].choices[choiceIdx];
  localStorage.setItem('dm_p'+phaseId+'_c'+step,chosen);
  localStorage.setItem('dm_step_'+phaseId,''+(step+1));
  viewDM.innerHTML=renderDMMessages(phase,step+1);
  scrollDMBottom();

  var nextStep=step+1;
  if(nextStep<phase.script.length && phase.script[nextStep].from){
    setTimeout(function(){advanceDM(phaseId);},1200);
  }
  if(nextStep>=phase.script.length){
    localStorage.setItem('dm_phase_'+phaseId+'_complete','true');
    initDMButton();
  }
};

function advanceDM(phaseId){
  var phase=null;
  for(var i=0;i<DM_PHASES.length;i++){if(DM_PHASES[i].id===phaseId){phase=DM_PHASES[i];break;}}
  if(!phase) return;
  var step=parseInt(localStorage.getItem('dm_step_'+phaseId)||'0',10);
  step++;
  localStorage.setItem('dm_step_'+phaseId,''+step);
  viewDM.innerHTML=renderDMMessages(phase,step);
  scrollDMBottom();

  if(step<phase.script.length && phase.script[step].from){
    setTimeout(function(){advanceDM(phaseId);},1200);
  }
  if(step>=phase.script.length){
    localStorage.setItem('dm_phase_'+phaseId+'_complete','true');
    initDMButton();
  }
}

function scrollDMBottom(){
  var area=document.getElementById('dm-msg-area');
  if(area) setTimeout(function(){area.scrollTop=area.scrollHeight;},50);
}

// 初期状態を履歴に記録
history.replaceState({view:'timeline'}, '', '');

})();
