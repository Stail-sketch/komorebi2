<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night 4 - こもれびゆうえんち2</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; user-select: none; -webkit-user-select: none; }
    img { -webkit-user-drag: none; pointer-events: none; }
    button, .cam-btn, .door-btn, .cam-toggle-btn { pointer-events: auto; }

    .hidden { display: none !important; }

    /* ===== ゲームコンテナ ===== */
    .game-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }

    /* ===== オフィスビュー ===== */
    #office-view { position: absolute; inset: 0; }
    #office-bg-open { width: 100%; height: 100%; object-fit: cover; }

    /* 左右モニターエリア */
    .side-area { position: absolute; overflow: hidden; }
    .side-entity { position: absolute; inset: 0; display: none; z-index: 0; }
    .side-entity.visible { display: block; }
    .side-entity img { width: 100%; height: 100%; object-fit: cover; }
    .side-light-overlay { position: absolute; inset: 0; background: rgba(180,0,0,0.35); display: none; z-index: 1; }
    .side-light-overlay.active { display: block; }
    .door-closed-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 2; transition: background 0.15s; }
    .door-closed-overlay.powered { background: transparent; }
    .door-closed-overlay.lit { background: rgba(120,0,0,0.55); }

    /* POWERボタン */
    .door-buttons { position: absolute; z-index: 5; display: flex; flex-direction: column; gap: 6px; }
    .door-btn {
      width: 120px; height: 70px;
      background: rgba(20,20,20,0.8); border: 2px solid #444;
      color: #0f0; font-family: 'Courier New', monospace; font-size: 14px;
      cursor: pointer; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 4px; letter-spacing: 2px;
      transition: background 0.15s, border-color 0.15s;
    }
    .door-btn:hover { background: rgba(40,40,40,0.9); border-color: #666; }
    .btn-power { color: #0f0; }
    .btn-power:hover { border-color: #0f0; }
    .btn-power.on { background: rgba(10,40,10,0.9); border-color: #0f0; color: #fff; }
    .btn-light { color: #fc4; }
    .btn-light:hover { border-color: #fc4; }
    .btn-light.active { background: rgba(40,30,10,0.9); border-color: #fc4; color: #fff; }

    /* HUD */
    #hud { position: absolute; z-index: 10; top: 10px; right: 14px; text-align: right; }
    .hud-row { font-size: 0.85rem; color: #5a8ab5; text-shadow: 0 0 6px rgba(80,140,200,0.3); line-height: 1.6; }
    #time-display { font-size: 2.2rem; color: #8cc; font-weight: bold; letter-spacing: 2px; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* パワー */
    #power-hud { position: absolute; z-index: 100; bottom: 20px; left: 20px; pointer-events: none; }
    #power-hud .power-label { font-size: 14px; color: #5a8ab5; letter-spacing: 2px; margin-bottom: 4px; }
    #power-bar-wrap { width: 160px; height: 10px; background: #111; border: 2px solid #2a3a50; }
    #power-bar { height: 100%; background: #4c8; transition: width 0.5s; }
    #power-bar.low { background: #e64; }
    #power-bar.critical { background: #f22; animation: blink 0.5s infinite; }

    /* カメラ開閉ボタン */
    .cam-toggle-btn {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      padding: 12px 32px; background: #1a1a2a; border: 2px solid #446;
      color: #8af; font-family: 'Courier New', monospace; font-size: 16px;
      cursor: pointer; letter-spacing: 2px; z-index: 15;
      transition: background 0.15s, border-color 0.15s;
    }
    .cam-toggle-btn:hover { background: #252540; border-color: #88f; }
    #camera-close-bar { background: #2a1a1a; border-color: #644; color: #f88; }
    #camera-close-bar:hover { background: #3a2020; border-color: #a66; }

    /* ===== カメラビュー ===== */
    #camera-view { position: absolute; inset: 0; z-index: 20; background: #000; }
    #camera-feed { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050a10; }
    #camera-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: 50% 50%;
      filter: brightness(0.50) contrast(1.15) saturate(0.25);
    }
    #camera-char {
      position: absolute; z-index: 2; bottom: 8%; left: 50%; height: 55%;
      transform: translateX(-50%);
      filter: brightness(0.50) contrast(1.15) saturate(0.25);
    }

    /* 静的キャラ（雰囲気用） */
    .camera-static-char {
      position: absolute; z-index: 1; bottom: 8%; left: 50%; height: 45%;
      transform: translateX(-50%);
      opacity: 0.5;
      filter: brightness(0.50) contrast(1.15) saturate(0.25);
    }

    #camera-scanlines {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
    }
    #camera-scanline-sweep {
      position: absolute; inset: 0; z-index: 4; pointer-events: none;
      background: linear-gradient(180deg, transparent 0%, rgba(150,200,255,0.03) 48%, rgba(150,200,255,0.08) 50%, rgba(150,200,255,0.03) 52%, transparent 100%);
      background-size: 100% 30%;
      animation: scanline 4s linear infinite;
    }
    @keyframes scanline { 0%{background-position:0 -30vh} 100%{background-position:0 130vh} }
    #camera-vignette { position: absolute; inset: 0; z-index: 5; pointer-events: none; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%); }
    #camera-noise {
      position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background: #000;
    }

    /* カメラUI */
    #camera-label { position: absolute; top: 14px; left: 18px; font-size: 1.1rem; color: rgba(100,200,255,0.8); z-index: 10; text-shadow: 0 0 10px rgba(100,200,255,0.4); }
    #rec-indicator { position: absolute; top: 14px; right: 18px; font-size: 0.8rem; color: #f44; z-index: 10; animation: blink 1s infinite; }

    /* カメラボタン */
    #cam-buttons { position: absolute; bottom: 16px; right: 16px; display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; z-index: 10; }
    .cam-btn {
      background: rgba(8,12,25,0.9); color: #5a90c0; border: 2px solid rgba(40,70,110,0.6);
      padding: 12px 22px; font-family: 'Courier New', monospace; font-size: 16px;
      cursor: pointer; border-radius: 2px; transition: all 0.12s; letter-spacing: 2px;
    }
    .cam-btn:hover { background: rgba(20,35,60,0.9); border-color: rgba(60,100,160,0.7); color: #8bc; }
    .cam-btn.active { background: rgba(30,55,90,0.95); border-color: #4af; color: #fff; box-shadow: 0 0 8px rgba(68,170,255,0.2); }
    /* DUCT入口/戻るボタン */
    #duct-enter-btn, #duct-back-btn {
      position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 16px 44px;
      font-family: 'Courier New', monospace; font-size: 18px; letter-spacing: 3px;
      cursor: pointer; border: 2px solid; transition: all 0.15s;
    }
    #duct-enter-btn {
      background: rgba(40,20,0,0.8); border-color: #f80; color: #f80;
    }
    #duct-enter-btn:hover { background: rgba(80,40,0,0.9); color: #fc4; }
    #duct-back-btn {
      background: rgba(0,20,40,0.8); border-color: #4af; color: #4af;
    }
    #duct-back-btn:hover { background: rgba(0,40,80,0.9); color: #8cf; }

    #camera-close-bar { z-index: 50; }

    /* ===== かすみオファーUI ===== */
    #kasumi-offer p { margin: 0; }
    #kasumi-accept, #kasumi-decline { pointer-events: auto; }

    /* ===== 蜘蛛の巣ゲージUI ===== */
    #web-gauge-ui {
      position: absolute; z-index: 50; top: 20px; right: 20px; text-align: right; display: none;
    }

    @keyframes bfShake { 0%{transform:translate(0,0)} 25%{transform:translate(-6px,4px)} 50%{transform:translate(5px,-5px)} 75%{transform:translate(-4px,-3px)} 100%{transform:translate(6px,5px)} }
    /* ===== オーバーレイ ===== */
    .overlay-screen { position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column; transition: opacity 1s ease; }
    .overlay-screen.active { display: flex; opacity: 1; }
    .overlay-screen.fade-out { opacity: 0; }
    #jumpscare-screen { background: #000; }
    #jumpscare-screen img { width: 100vw; height: 100vh; object-fit: contain; animation: shake 0.3s infinite; }
    @keyframes shake { 0%{transform:translate(0,0) scale(1.05)} 25%{transform:translate(-5px,3px) scale(1.08)} 50%{transform:translate(4px,-4px) scale(1.05)} 75%{transform:translate(-3px,5px) scale(1.07)} 100%{transform:translate(5px,-2px) scale(1.05)} }
    #gameover-screen { background: #000; gap: 30px; }
    #gameover-screen h1 { font-size: 3rem; color: #c00; letter-spacing: 0.3em; text-shadow: 0 0 30px rgba(200,0,0,0.5); }
    .overlay-btn { background: none; border: 1px solid #666; color: #888; padding: 10px 40px; font-family: 'Courier New', monospace; font-size: 1rem; cursor: pointer; }
    .overlay-btn:hover { border-color: #aaa; color: #fff; }
    #clear-screen { background: #000; }
    #clear-screen h1 { font-size: 2.5rem; color: #acd; letter-spacing: 0.5em; animation: fadeUp 2s ease; }
    #clear-screen p { margin-top: 20px; color: #567; font-size: 0.9rem; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    /* スタート画面 */
    #start-screen {
      background: #000; z-index: 2000;
      flex-direction: column; gap: 0;
      cursor: default;
    }
    #start-title {
      font-size: 5rem; letter-spacing: 0.4em; color: #4a7aaa;
      text-shadow: 0 0 20px rgba(60,120,180,0.3);
      margin-bottom: 12px; min-height: 3.5rem;
    }
    #start-title .cursor {
      display: inline-block; width: 2px; height: 1em;
      background: #4a7aaa; vertical-align: text-bottom;
      margin-left: 4px; animation: cursorBlink 0.6s step-end infinite;
    }
    @keyframes cursorBlink { 0%,100% { border-color: #4a7aaa; } 50% { border-color: transparent; } }
    #start-sub {
      color: #334; font-size: 0.85rem; letter-spacing: 0.15em;
      opacity: 0; animation: fadeIn 1s 2.8s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    #start-btn:hover { background: #2a4a6a; color: #000; border-color: #4a7aaa; }
    /* フェードアウト */
    #start-screen.fade-out {
      animation: screenFadeOut 1.5s ease forwards;
    }
    @keyframes screenFadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- オーバーレイ -->
  <div id="start-screen" class="overlay-screen">
    <div id="start-title"><span id="title-text"></span><span class="cursor"></span></div>
    <div id="start-sub">3:00 AM - 4:00 AM</div>
  </div>
  <!-- かすみオファーUI -->
  <div id="kasumi-offer" style="display:none; position:absolute; top:15.8%; left:27.7%; width:44.6%; height:48.5%; z-index:55; background:#000; border:2px solid #400; overflow:hidden;">
    <p style="color:#c00; font-size:18px; font-weight:bold; text-shadow:0 0 15px rgba(200,0,0,0.8); letter-spacing:2px; text-align:center; padding-top:8px;">手を貸してあげようか？？</p>
    <div style="display:flex; width:100%; height:calc(100% - 36px); align-items:center; justify-content:center;">
      <div style="flex:0 0 25%; display:flex; align-items:center; justify-content:center;">
        <button id="kasumi-accept" style="padding:12px 16px; background:#200; border:2px solid #c00; color:#c00; cursor:pointer; font-family:'Courier New',monospace; font-size:14px; letter-spacing:1px; transition:all 0.2s; writing-mode:vertical-rl;" onmouseover="this.style.background='#c00';this.style.color='#000'" onmouseout="this.style.background='#200';this.style.color='#c00'">受け取る</button>
      </div>
      <div style="flex:0 0 50%; display:flex; align-items:center; justify-content:center; height:100%;">
        <img src="../image/character/kasumi door.png" style="max-height:90%; max-width:100%; filter:brightness(0.8);" draggable="false">
      </div>
      <div style="flex:0 0 25%; display:flex; align-items:center; justify-content:center;">
        <button id="kasumi-decline" style="padding:12px 16px; background:#111; border:2px solid #444; color:#444; cursor:pointer; font-family:'Courier New',monospace; font-size:14px; letter-spacing:1px; transition:all 0.2s; writing-mode:vertical-rl;" onmouseover="this.style.background='#444';this.style.color='#000'" onmouseout="this.style.background='#111';this.style.color='#444'">受け取らない</button>
      </div>
    </div>
  </div>

  <!-- ブリーフィング画面 -->
  <div id="briefing-screen" class="overlay-screen active" style="background:#000;justify-content:flex-start;padding:8vh 10vw;">
    <div id="briefing-log" style="font-family:'Courier New',monospace;font-size:15px;line-height:2.2;max-width:700px;overflow-y:auto;max-height:75vh;"></div>
    <button id="briefing-start-btn" style="
      margin-top:30px;padding:14px 56px;background:none;
      border:1px solid #1a3a1a;color:#1a3a1a;font-family:'Courier New',monospace;
      font-size:1.1rem;letter-spacing:0.3em;cursor:pointer;
      opacity:0;transition:opacity 0.8s,background 0.2s,color 0.2s,border-color 0.2s;
    ">▶ broadcast_start</button>
    <div id="glitch-overlay" style="position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0;transition:opacity 0.1s;"></div>
  </div>

  <div id="jumpscare-screen" class="overlay-screen"><img src="../image/character/kururu jumpscare.png" alt=""></div>
  <div id="gameover-screen" class="overlay-screen"><h1>GAME OVER</h1><button class="overlay-btn" id="retry-btn">RETRY</button></div>
  <div id="clear-screen" class="overlay-screen"><h1>NIGHT 4 CLEAR</h1><p>4:00 AM</p></div>

  <!-- ===== ゲーム本体 ===== -->
  <div class="game-container">

    <!-- オフィスビュー -->
    <div id="office-view">
      <img id="office-bg-open" src="../image/camera/desk_on.png.png" alt="">

      <div id="left-area" class="side-area">
        <div class="side-light-overlay" id="left-light"></div>
        <div class="door-closed-overlay" id="left-door"></div>
        <div class="side-entity" id="left-entity"><img id="left-entity-img" src="../image/character/kururu door.png" alt=""></div>
      </div>
      <div id="right-area" class="side-area">
        <div class="side-light-overlay" id="right-light"></div>
        <div class="door-closed-overlay" id="right-door"></div>
        <div class="side-entity" id="right-entity"><img id="right-entity-img" src="../image/character/kururu door.png" alt=""></div>
      </div>

      <div class="door-buttons" id="left-buttons">
        <button class="door-btn btn-power" data-side="left">POWER (Q)</button>
        <button class="door-btn btn-light" data-side="left">LIGHT (A)</button>
      </div>
      <div class="door-buttons" id="right-buttons">
        <button class="door-btn btn-power" data-side="right">POWER (E)</button>
        <button class="door-btn btn-light" data-side="right">LIGHT (D)</button>
      </div>

      <div id="hud">
        <div id="time-display">3:00 AM</div>
        <div class="hud-row">Night 4</div>
      </div>

      <button id="cam-toggle-area" class="cam-toggle-btn">OPEN CAMERA (SPACE)</button>
    </div>

    <!-- カメラビュー -->
    <div id="camera-view" class="hidden">
      <div id="camera-feed">
        <img id="camera-bg" src="../image/camera/CAM1.png" alt="">
        <img id="camera-char" class="hidden" src="" alt="">
        <!-- 静的キャラ（雰囲気用） -->
        <img id="camera-static-char" class="hidden camera-static-char" src="" alt="">
        <!-- エフェクト -->
        <div id="camera-scanlines"></div>
        <div id="camera-scanline-sweep"></div>
        <div id="camera-vignette"></div>
        <div id="camera-noise" class="hidden"></div>
        <!-- 蜘蛛の巣オーバーレイ -->
        <div id="web-overlay" style="display:none; position:absolute; inset:0; z-index:7; pointer-events:none;">
  <svg width="100%" height="100%" viewBox="0 0 400 400" style="position:absolute;inset:0;">
    <!-- Radial lines -->
    <line x1="200" y1="200" x2="200" y2="0" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="200" y1="200" x2="400" y2="0" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <line x1="200" y1="200" x2="400" y2="200" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="200" y1="200" x2="400" y2="400" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <line x1="200" y1="200" x2="200" y2="400" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="200" y1="200" x2="0" y2="400" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <line x1="200" y1="200" x2="0" y2="200" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="200" y1="200" x2="0" y2="0" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
    <!-- Spiral rings -->
    <circle cx="200" cy="200" r="40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <circle cx="200" cy="200" r="80" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <circle cx="200" cy="200" r="120" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="200" cy="200" r="200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </svg>
</div>
        <!-- DUCT入口ボタン（CAM6の時だけ表示） -->
        <button id="duct-enter-btn" class="hidden">&#9660; DUCT CAMERA [W]</button>
        <!-- DUCT→前のCAMに戻るボタン -->
        <button id="duct-back-btn" class="hidden">&#9650; BACK TO CAM [W]</button>
        <!-- UI -->
        <span id="camera-label">CAM 1</span>
        <span id="rec-indicator">&#9679; REC</span>
        <div id="cam-buttons">
          <button class="cam-btn active" data-cam="1">CAM1</button>
          <button class="cam-btn" data-cam="2">CAM2</button>
          <button class="cam-btn" data-cam="3">CAM3</button>
          <button class="cam-btn" data-cam="4">CAM4</button>
          <button class="cam-btn" data-cam="5">CAM5</button>
          <button class="cam-btn" data-cam="6">CAM6</button>
          <button class="cam-btn" data-cam="7">CAM7</button>
          <button class="cam-btn" data-cam="8">CAM8</button>
        </div>
        <!-- バグアイコン（電力回復用） -->
        <div id="bug-icon" style="display:none;position:absolute;z-index:50;cursor:pointer;font-family:'Courier New',monospace;font-size:13px;color:#ff3333;text-shadow:0 0 6px rgba(255,0,0,0.5);background:rgba(0,0,0,0.6);padding:3px 8px;border:1px solid rgba(255,0,0,0.3);border-radius:2px;user-select:none;pointer-events:auto;transition:opacity 0.3s;" onclick="collectBugIcon()"></div>
        <button id="camera-close-bar" class="cam-toggle-btn">CLOSE CAMERA (SPACE)</button>

    <!-- 蜘蛛の巣ゲージ（常時表示） -->

  </div>

<script>
if(localStorage.getItem('night4_clear')==='true'){window.location.href='../index.html';}
// ============================================================
// Night4 ゲームエンジン
// ============================================================

// --- アクセス制御 ---
if (!localStorage.getItem('night3_clear')) {
  alert('Night 3をクリアしてください。');
  window.location.href = '../index.html';
}

const $ = id => document.getElementById(id);

// --- ブラウザの戻る・リロードを無効化 ---
history.pushState(null, '', location.href);
window.addEventListener('popstate', () => { history.pushState(null, '', location.href); });
function _blockUnload(e) { e.preventDefault(); }
window.addEventListener('beforeunload', _blockUnload);
function allowNavigation() { window.removeEventListener('beforeunload', _blockUnload); }
window.addEventListener('keydown', e => {
  if (e.key === 'F5') e.preventDefault();
  if ((e.ctrlKey || e.metaKey) && e.key === 'r') e.preventDefault();
  if (e.altKey && e.key === 'ArrowLeft') e.preventDefault();
});
const IMG_W = 1536, IMG_H = 1024;

// --- カメラごとのキャラ表示位置 ---
const CAM_CHAR_POS = {
  1: { bottom: '8%',  left: '50%', height: '55%' },
  2: { bottom: '10%', left: '45%', height: '50%' },
  3: { bottom: '5%',  left: '55%', height: '50%' },
  4: { bottom: '8%',  left: '50%', height: '55%' },
  5: { bottom: '8%',  left: '50%', height: '50%' },
  6: { bottom: '10%', left: '50%', height: '55%' },
  7: { bottom: '20%', left: '48%', height: '35%' },
  8: { bottom: '15%', left: '50%', height: '35%' },

};

// --- cover計算 ---
function getCoverTransform() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const imgR = IMG_W / IMG_H, vpR = vw / vh;
  let rW, rH, oX, oY;
  if (vpR > imgR) { rW = vw; rH = vw / imgR; oX = 0; oY = (vh - rH) / 2; }
  else { rH = vh; rW = vh * imgR; oX = (vw - rW) / 2; oY = 0; }
  return { rW, rH, oX, oY, vw, vh };
}

// --- 左右モニターエリア ---
const sideShapes = {
  left: [{x:9.45,y:5.70},{x:25.80,y:11.85},{x:25.70,y:58.85},{x:9.30,y:60.90}],
  right: [{x:74.30,y:11.85},{x:90.75,y:5.60},{x:90.85,y:60.90},{x:74.30,y:59.15}]
};

function applySideAreas() {
  const ct = getCoverTransform();
  ['left','right'].forEach(side => {
    const pts = sideShapes[side].map(p => {
      const sx = ct.oX + ct.rW * p.x / 100;
      const sy = ct.oY + ct.rH * p.y / 100;
      return { x: sx / ct.vw * 100, y: sy / ct.vh * 100 };
    });
    const minX = Math.min(...pts.map(p=>p.x)), maxX = Math.max(...pts.map(p=>p.x));
    const minY = Math.min(...pts.map(p=>p.y)), maxY = Math.max(...pts.map(p=>p.y));
    const el = $(side + '-area');
    el.style.left = minX + 'vw'; el.style.top = minY + 'vh';
    el.style.width = (maxX-minX) + 'vw'; el.style.height = (maxY-minY) + 'vh';
    const clip = pts.map(p => {
      const rx = (maxX-minX)>0 ? (p.x-minX)/(maxX-minX)*100 : 0;
      const ry = (maxY-minY)>0 ? (p.y-minY)/(maxY-minY)*100 : 0;
      return rx.toFixed(1)+'% '+ry.toFixed(1)+'%';
    });
    el.style.clipPath = 'polygon('+clip.join(', ')+')';
  });
  const lbP = ct.oX + ct.rW * 9.4 / 100;
  const rbP = ct.oX + ct.rW * 82 / 100;
  const btnY = ct.oY + ct.rH * 62 / 100;
  $('left-buttons').style.left = lbP + 'px'; $('left-buttons').style.top = btnY + 'px';
  $('right-buttons').style.left = rbP + 'px'; $('right-buttons').style.top = btnY + 'px';
}

function startGame() {
  $('start-screen').classList.add('fade-out');
  setTimeout(() => {
    $('start-screen').classList.remove('active');
    running = true; elapsed = 0; power = 100;
    sndBGM.play().catch(()=>{});
    sndClock.play().catch(()=>{});
    tickId = setInterval(gameTick, 1000);
    pwrId = setInterval(powerTick, 500);
    // Start all enemies
    scheduleKururuMove();
    scheduleMadaraMove();
    startKasumiCycle();
    startWebGauge();
    scheduleBugIcon();
  }, 1500);
}

function gameTick() {
  if (!running) return;
  elapsed++;
  // 3:00 AM → 4:00 AM in 3 minutes
  const progress = Math.min(elapsed / NIGHT_DURATION, 1);
  const minutes = Math.floor(progress * 6) * 10; // 0,10,20,30,40,50 → 3:00~3:50
  if (progress >= 1) {
    $('time-display').textContent = '4:00 AM';
    nightClear();
  } else {
    $('time-display').textContent = `3:${String(minutes).padStart(2,'0')} AM`;
  }
}

function powerTick() {
  if (!running) return;
  let d = DRAIN_BASE;
  if (camOpen) d += DRAIN_CAM;
  if (doorL) d += DRAIN_DOOR;
  if (doorR) d += DRAIN_DOOR;
  if (lightL) d += DRAIN_LIGHT;
  if (lightR) d += DRAIN_LIGHT;
  power = Math.max(0, power - d);
  const p = Math.round(power);
  $('power-display').textContent = p;
  $('power-bar').style.width = p + '%';
  $('power-bar').classList.toggle('low', p <= 25 && p > 10);
  $('power-bar').classList.toggle('critical', p <= 10);
  if (power <= 0) powerOut();
}

  if (!kururuPath || kururuCam === 1) {
    kururuPath = Math.random() < 0.5 ? PATH_L : PATH_R;
    kururuIdx = 0;
  }
  kururuIdx++;
  if (kururuIdx >= kururuPath.length) {
    kururuArriveAtDoor(kururuPath === PATH_L ? 'left' : 'right');
    return;
  }
  const n = kururuPath[kururuIdx];
  if (typeof n === 'number') kururuCam = n;
  if (camOpen) updateCameraChar();
  checkKururuWatch();
  scheduleKururuMove();
}
function kururuArriveAtDoor(side) {
  kururuDoor = side; kururuCam = -1;
  if (camOpen) updateCameraChar();
  updateSideEntity();
  if ((side === 'left' && doorL) || (side === 'right' && doorR)) { defeatKururu(); return; }
  kururuDT = setTimeout(() => {
    if (!running || kururuDoor !== side) return;
    if ((side === 'left' && !doorL) || (side === 'right' && !doorR)) gameOver('kururu');

  clearTimeout(kururuDT);
  $('left-entity').classList.remove('visible'); $('right-entity').classList.remove('visible');

// ============================================================
function startWebGauge() {
  webGauge = 100;
  webDraining = true;
  webHolding = false;
  updateWebGaugeUI();
  // 200msごとにtick（5回/秒）
  clearInterval(webTickId);
  webTickId = setInterval(webGaugeTick, 200);
}

function webGaugeTick() {
  if (!running) return;
  if (webHolding) {
    // 長押し中は回復
    webGauge = Math.min(100, webGauge + WEB_REPLENISH_RATE);
  } else {
    // 常時減少
    webGauge = Math.max(0, webGauge - WEB_DRAIN_RATE);
  }
  updateWebGaugeUI();
  if (camOpen && curCam === 9) updateCameraChar();
  if (webGauge <= 0) {
    // アラネ攻撃！
    clearInterval(webTickId);
    gameOver('araane');
  }
}

function startWebReplenish() {
  if (!running || curCam !== 9 || !camOpen) return;
  webHolding = true;
}

function stopWebReplenish() {
  webHolding = false;
}

function updateWebGaugeUI() {
  var bar = $('web-gauge-bar');
  var text = $('web-gauge-text');
  if (bar) bar.style.width = webGauge + '%';
  if (text) text.textContent = Math.round(webGauge) + '%';
  var color = webGauge > 50 ? '#f80' : webGauge > 25 ? '#f44' : '#f00';
  if (bar) bar.style.background = color;
  // Show/hide web gauge based on current camera
  var webUI = $('web-gauge-ui');
  if(webUI) { webUI.style.display = (camOpen && curCam === 9) ? 'block' : 'none'; }
  // Update web overlay on duct cam
  var webOv = document.getElementById('web-overlay');
  if(webOv) {
    if(camOpen && curCam === 9) {
      webOv.style.display = 'block';
      var scale = webGauge / 100;
      webOv.style.transform = 'scale(' + scale + ')';
      webOv.style.opacity = (0.3 + scale * 0.7).toFixed(2);
    } else {
      webOv.style.display = 'none';
    }
  }
}

function gameOver(killer) {
  running = false; clearTimers(); stopAllSounds();
  killer = killer || 'kururu';
  const jumpImg = {
    kururu: '../image/character/kururu jumpscare.png',
    madara: '../image/character/madara jumpscare.png',
    kasumi: '../image/character/kasumi jumpscare.png',
    araane: '../image/character/arane jumpscare.png',
    yowari: '../image/character/yowari jumpscare.png',
  };
  $('jumpscare-screen').querySelector('img').src = jumpImg[killer] || jumpImg.kururu;
  if (sndJump[killer]) playS(sndJump[killer]);
  $('jumpscare-screen').classList.add('active');
  setTimeout(() => { $('jumpscare-screen').classList.remove('active'); $('gameover-screen').classList.add('active'); }, 1000);
}

function nightClear() {
  running = false; clearTimers(); stopAllSounds();
  localStorage.setItem('night4_clear', 'true');
  localStorage.setItem('night4_pages_unlocked', 'true');
  playS(sndClearChime);
  $('clear-screen').classList.add('active');
  setTimeout(() => playS(sndClearYay), 500);
  setTimeout(() => {
    allowNavigation();
    var btn = document.createElement('button');
    btn.textContent = '次へ進む';
    btn.style.cssText = 'display:block;margin:30px auto;padding:14px 48px;background:transparent;border:2px solid #8cc;color:#8cc;font-size:18px;font-family:inherit;cursor:pointer;letter-spacing:3px;transition:all 0.3s;';
    btn.onmouseover = function(){ this.style.background='#8cc'; this.style.color='#000'; };
    btn.onmouseout = function(){ this.style.background='transparent'; this.style.color='#8cc'; };
    btn.onclick = function(){ window.location.href = '../index.html'; };
    document.getElementById('clear-screen').appendChild(btn);
  }, 2000);
}

function clearTimers() {
  clearInterval(tickId); clearInterval(pwrId);
  // kururu
  clearTimeout(kururuMT); clearTimeout(kururuDT); clearTimeout(kururuWT);
  // madara
  clearTimeout(madaraMT); clearTimeout(madaraDT);
  // kasumi
  clearTimeout(kasumiTimer); clearTimeout(kasumiNoiseTimer); clearTimeout(kasumiDismissTimer);
  // araane web gauge
  clearInterval(webTickId);
  clearTimeout(bugSpawnTimer); clearTimeout(bugDespawnTimer);
}

// ===== バグアイコン（カメラ電力回復） =====
var bugSpawnTimer, bugDespawnTimer;
var bugActiveCam = -1;
var BUG_CODES = ['ERR_0x4F','SYS_NULL','0xDEAD','NaN','#REF!','FAULT','??:??','0x0000','ERR_K059','VOID','SEGFAULT','OVERFLOW','_NULL_','0xFFFF','ERR_MEM'];

function scheduleBugIcon(){
  if(!running) return;
  var delay = 15000 + Math.random() * 20000;
  bugSpawnTimer = setTimeout(spawnBugIcon, delay);
}

function spawnBugIcon(){
  if(!running) return;
  var el = $('bug-icon');
  bugActiveCam = Math.floor(Math.random() * 8) + 1;
  el.style.top = (15 + Math.random() * 60) + '%';
  el.style.left = (10 + Math.random() * 70) + '%';
  el.textContent = BUG_CODES[Math.floor(Math.random() * BUG_CODES.length)];
  if(camOpen && curCam === bugActiveCam){
    el.style.display = 'block'; el.style.opacity = '1';
  }
  bugDespawnTimer = setTimeout(function(){
    el.style.display = 'none';
    bugActiveCam = -1;
    scheduleBugIcon();
  }, 20000);
}

function collectBugIcon(){
  var el = $('bug-icon');
  el.style.opacity = '0';
  setTimeout(function(){ el.style.display = 'none'; }, 300);
  bugActiveCam = -1;
  clearTimeout(bugDespawnTimer);
  var recover = 2 + Math.random();
  power = Math.min(100, power + recover);
  var p = Math.round(power);
  $('power-display').textContent = p;
  $('power-bar').style.width = p + '%';
  $('power-bar').classList.toggle('low', p <= 25 && p > 10);
  $('power-bar').classList.toggle('critical', p <= 10);
  scheduleBugIcon();
}

function retryGame() {
  $('gameover-screen').classList.remove('active');
  $('jumpscare-screen').classList.remove('active');
  $('clear-screen').classList.remove('active');
  $('camera-view').classList.add('hidden');

  // タイトル表示→自動でゲーム開始（リトライ時はブリーフィング省略）
  $('title-text').textContent = 'NIGHT 4';
  $('start-sub').style.animation = 'none'; $('start-sub').style.opacity = '1';
  $('start-screen').classList.remove('fade-out','hidden');
  $('start-screen').style.opacity = '1';
  $('start-screen').classList.add('active');
  setTimeout(function(){
    $('start-screen').classList.add('fade-out');
    setTimeout(function(){ $('start-screen').classList.remove('active','fade-out'); $('start-screen').classList.add('hidden'); startGame(); }, 1000);
  }, 2000);

  // 状態リセット
  stopAllSounds();
  elapsed = 0; power = 100; camOpen = false; curCam = 1;
  doorL = false; doorR = false;
  lightL = false; lightR = false;
  // kururu reset
  kururuCam = 1; kururuPath = null; kururuIdx = 0; kururuDoor = null; kururuSpd = 'normal';
  // madara reset
  madaraCam = 1; madaraPath = null; madaraIdx = 0; madaraDoor = null;
  // kasumi reset
  $('kasumi-offer').style.display = 'none';
  $('camera-feed').style.filter = '';
  var _ov = document.getElementById('kasumi-noise-overlay'); if(_ov) _ov.remove();
  // araane reset
  webGauge = 100; webHolding = false;
  updateWebGaugeUI();

  $('left-door').classList.remove('powered','lit'); $('right-door').classList.remove('powered','lit');
  $('left-light').classList.remove('active'); $('right-light').classList.remove('active');
  $('left-entity').classList.remove('visible'); $('right-entity').classList.remove('visible');
  document.querySelector('#left-buttons .btn-power').classList.remove('on');
  document.querySelector('#right-buttons .btn-power').classList.remove('on');
  document.querySelector('#left-buttons .btn-light').classList.remove('active');
  document.querySelector('#right-buttons .btn-light').classList.remove('active');
  $('time-display').textContent = '3:00 AM';
  $('power-display').textContent = '100';
  $('power-bar').style.width = '100%';
  $('power-bar').classList.remove('low', 'critical');
}

function runBriefing(lines){
  var log = $('briefing-log');
  var ov = $('glitch-overlay');
  var screen = $('briefing-screen');
  log.innerHTML = '';
  var idx = 0;
  function fxShake(dur){ screen.style.animation='bfShake '+(dur<500?'0.05':'0.08')+'s infinite'; setTimeout(function(){screen.style.animation='';},dur); }
  function fxFlash(color,dur){ ov.style.background=color||'#ff0000'; ov.style.opacity='0.6'; setTimeout(function(){ov.style.opacity='0';ov.style.background='';},dur); }
  function fxFlicker(dur){ var end=Date.now()+dur; var iv=setInterval(function(){ if(Date.now()>end){clearInterval(iv);ov.style.opacity='0';return;} ov.style.background=Math.random()>0.5?'#ff0033':'#000'; ov.style.opacity=String(Math.random()*0.7); },50); }
  function fxNoise(dur){ var ne=document.createElement('div'); ne.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9998;pointer-events:none;font-family:monospace;font-size:14px;color:rgba(255,0,0,0.25);overflow:hidden;line-height:1;word-break:break-all;'; var ch='\u2588\u2591\u2592\u2593\u2502\u2500\u253c\u2524\u251c\u00a7\u25a0\u25a1'; function fill(){var s='';for(var i=0;i<8000;i++)s+=ch[Math.floor(Math.random()*ch.length)];ne.textContent=s;} fill(); document.body.appendChild(ne); var niv=setInterval(fill,80); setTimeout(function(){clearInterval(niv);ne.remove();},dur); }
  function fxBlackout(dur){ ov.style.background='#000'; ov.style.opacity='1'; log.style.visibility='hidden'; setTimeout(function(){ov.style.opacity='0';log.style.visibility='';},dur); }
  function next(){
    if(idx>=lines.length){ var btn=$('briefing-start-btn'); btn.style.opacity='1'; btn.style.borderColor='#2a6a2a'; btn.style.color='#2a6a2a'; return; }
    var line=lines[idx]; idx++;
    if(line.type==='fx'){ var d=line.duration||500; if(line.fx==='shake')fxShake(d); else if(line.fx==='flash')fxFlash(line.color,d); else if(line.fx==='flicker')fxFlicker(d); else if(line.fx==='noise')fxNoise(d); else if(line.fx==='blackout')fxBlackout(d); setTimeout(next,d+100); return; }
    if(line.type==='gap'){ setTimeout(next,400); return; }
    var div=document.createElement('div');
    if(line.type==='sys'){ div.style.cssText='color:'+(line.warn?'#a44':'#335')+';font-size:13px;'; typeText(div,'[SYSTEM] '+line.text,20,function(){setTimeout(next,300);}); }
    else { div.style.cssText='color:'+line.color+';'; if(line.glitch)div.style.textShadow='2px 0 #f00, -2px 0 #0ff'; typeText(div,'['+line.name+'] '+line.text,25,function(){if(line.glitch)setTimeout(function(){div.style.textShadow='none';},300);setTimeout(next,line.glitch?600:350);}); }
    log.appendChild(div); log.scrollTop=log.scrollHeight;
  }
  setTimeout(next,800);
}

function typeText(el, text, speed, cb){
  var i = 0; el.textContent = '';
  function t(){ if(i < text.length){ el.textContent += text[i]; i++; if(el.parentElement) el.parentElement.scrollTop = el.parentElement.scrollHeight; setTimeout(t, speed); } else if(cb) cb(); }
  t();
}

$('briefing-start-btn').addEventListener('click', () => {
  $('briefing-screen').classList.remove('active');

  $('start-screen').classList.add('active');
  var titleEl = $('title-text');
  var text = 'NIGHT 4';
  var i = 0;
  setTimeout(function typeTitle(){
    if(i < text.length){ titleEl.textContent += text[i]; i++; setTimeout(typeTitle, 150); }
    else { setTimeout(function(){ $('start-screen').classList.add('fade-out'); setTimeout(function(){ $('start-screen').classList.remove('active','fade-out'); $('start-screen').classList.add('hidden'); startGame(); }, 1000); }, 1500); }
  }, 400);
});

});

document.querySelectorAll('.btn-light').forEach(b => {
  b.addEventListener('mousedown', () => running && setLight(b.dataset.side, true));
  b.addEventListener('mouseup', () => setLight(b.dataset.side, false));
  b.addEventListener('mouseleave', () => setLight(b.dataset.side, false));
});

// --- キーボード操作 ---
document.addEventListener('keydown', e => {
  if (!running) return;
  switch(e.key.toLowerCase()) {
    case 'q': if (!camOpen) togglePower('left'); break;
    case 'e': if (!camOpen) togglePower('right'); break;
    case 'a': if (!camOpen) setLight('left', true); break;
    case 'd': if (!camOpen) setLight('right', true); break;
    case 'w': if (camOpen) { curCam === 9 ? switchCam(prevCam || 1) : switchCam(9); } break;
    case ' ': e.preventDefault(); camOpen ? closeCamera() : openCamera(); break;
  }
});
document.addEventListener('keyup', e => {
  switch(e.key.toLowerCase()) {
    case 'a': setLight('left', false); break;
    case 'd': setLight('right', false); break;
  }
});
