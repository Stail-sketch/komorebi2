<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ending B - あの番組を覚えていますか 〜木漏れ日遊園地編〜</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Yu Mincho','YuMincho','Hiragino Mincho ProN','MS PMincho',serif;
  }
  #screen{
    position:fixed;top:0;left:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    z-index:1;
  }

  #crt-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:20;
    opacity:0.3;
    transition:opacity 8s ease;
  }
  #crt-overlay::before{
    content:'';position:absolute;top:0;left:0;width:100%;height:100%;
    background:repeating-linear-gradient(0deg,
      rgba(0,255,65,0.03) 0px, rgba(0,255,65,0.03) 1px,
      transparent 1px, transparent 3px);
    animation:crt-scroll 4s linear infinite;
  }
  #crt-overlay::after{
    content:'';position:absolute;top:0;left:0;width:100%;height:100%;
    background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
  }
  @keyframes crt-scroll{0%{background-position:0 0;}100%{background-position:0 100vh;}}

  #noise-layer{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:18;overflow:hidden;
  }
  .noise-line{
    position:absolute;height:1px;
    background:rgba(0,255,65,0.15);
    animation:noise-flash 0.15s linear forwards;
  }
  @keyframes noise-flash{0%{opacity:1;}100%{opacity:0;}}

  .terminal-line{
    color:#00ff41;
    font-family:'Courier New',Consolas,monospace;
    font-size:clamp(14px,2.2vw,20px);
    text-align:left;opacity:0;white-space:pre;
    text-shadow:0 0 8px rgba(0,255,65,0.4);
    letter-spacing:0.08em;line-height:1.8;
    transition:opacity 0.3s ease;
  }
  .terminal-line.visible{opacity:1;}

  #terminal-container{
    width:80%;max-width:700px;max-height:80vh;
    overflow:hidden;display:flex;flex-direction:column;gap:0.2em;
  }

  .yoshida-text{
    color:#e0e0e0;
    font-family:'Yu Mincho','YuMincho','Hiragino Mincho ProN',serif;
    font-size:clamp(18px,3vw,28px);
    text-align:center;opacity:0;position:absolute;
    letter-spacing:0.15em;line-height:2.2;
    transition:opacity 0.4s ease;
  }
  .yoshida-text.visible{opacity:1;}

  .process-text{
    color:#00ff41;
    font-family:'Courier New',Consolas,monospace;
    font-size:clamp(14px,2.2vw,20px);
    text-align:center;opacity:0;position:absolute;
    letter-spacing:0.12em;
    text-shadow:0 0 8px rgba(0,255,65,0.4);
    transition:opacity 0.2s ease;
  }
  .process-text.visible{opacity:1;}

  #timestamp{
    position:fixed;bottom:10px;left:14px;
    color:rgba(0,255,65,0.15);
    font-family:'Courier New',monospace;
    font-size:10px;letter-spacing:0.08em;
    z-index:2;pointer-events:none;
  }
</style>
</head>
<body>
<div id="screen"></div>
<div id="crt-overlay"></div>
<div id="noise-layer"></div>
<div id="timestamp">[00:00:00]</div>

<script>
if(localStorage.getItem('night5_clear')!=='true'){document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#000;color:#333;font-family:monospace;font-size:14px;">アクセスできません</div>';throw new Error();}
(function(){
  var screen = document.getElementById('screen');
  var crtOverlay = document.getElementById('crt-overlay');
  var noiseLayer = document.getElementById('noise-layer');
  var timestampEl = document.getElementById('timestamp');

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function clearScreen(){
    screen.innerHTML = '';
    screen.style.display = 'flex';
    screen.style.alignItems = 'center';
    screen.style.justifyContent = 'center';
    screen.style.flexDirection = 'column';
  }

  function setCrtIntensity(level){
    crtOverlay.style.opacity = String(0.2 + level * 0.8);
  }

  var noiseInterval = null;
  function startNoise(intensity){
    if(noiseInterval) clearInterval(noiseInterval);
    noiseInterval = setInterval(function(){
      if(Math.random() > intensity) return;
      var line = document.createElement('div');
      line.className = 'noise-line';
      line.style.top = (Math.random()*100)+'%';
      line.style.left = '0';
      line.style.width = (20+Math.random()*80)+'%';
      if(Math.random()>0.5){line.style.left='auto';line.style.right='0';}
      noiseLayer.appendChild(line);
      setTimeout(function(){line.remove();},200);
    },80);
  }
  function stopNoise(){
    if(noiseInterval){clearInterval(noiseInterval);noiseInterval=null;}
    noiseLayer.innerHTML='';
  }

  var tsStart = 0;
  var tsInterval = null;
  var tsFrozen = false;
  function startTimestamp(){
    tsStart = Date.now();
    tsInterval = setInterval(function(){
      if(tsFrozen) return;
      var elapsed = Math.floor((Date.now() - tsStart) / 1000);
      var h = String(Math.floor(elapsed/3600)).padStart(2,'0');
      var m = String(Math.floor((elapsed%3600)/60)).padStart(2,'0');
      var s = String(elapsed%60).padStart(2,'0');
      timestampEl.textContent = '['+h+':'+m+':'+s+']';
    }, 1000);
  }

  function screenBlink(duration){
    var blink = document.createElement('div');
    blink.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:25;pointer-events:none;';
    document.body.appendChild(blink);
    return wait(duration||150).then(function(){blink.remove();});
  }

  var reduceFlash = localStorage.getItem('reduce_flash') === 'true';

  function flashWhite(duration){
    if(reduceFlash) return;
    var f = document.createElement('div');
    f.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:25;pointer-events:none;';
    document.body.appendChild(f);
    setTimeout(function(){ f.remove(); }, duration || 80);
  }

  function typewriterLine(container, text, speed){
    return new Promise(function(resolve){
      var line = document.createElement('div');
      line.className = 'terminal-line visible';
      line.textContent = '';
      container.appendChild(line);
      var i = 0;
      var iv = setInterval(function(){
        if(i < text.length){line.textContent += text[i]; i++;}
        else {clearInterval(iv); resolve(line);}
      }, speed || 40);
    });
  }

  function typewriterLineUneven(container, text, baseSpeed){
    return new Promise(function(resolve){
      var line = document.createElement('div');
      line.className = 'terminal-line visible';
      line.textContent = '';
      container.appendChild(line);
      var i = 0;
      function nextChar(){
        if(i < text.length){
          line.textContent += text[i]; i++;
          var jitter = baseSpeed + Math.floor((Math.random()-0.3)*baseSpeed*0.8);
          if(jitter < 10) jitter = 10;
          setTimeout(nextChar, jitter);
        } else { resolve(line); }
      }
      nextChar();
    });
  }

  function showYoshidaLine(text){
    return new Promise(function(resolve){
      var el = document.createElement('div');
      el.className = 'yoshida-text';
      el.textContent = text;
      screen.appendChild(el);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ el.classList.add('visible'); });
      });
      setTimeout(function(){ resolve(el); }, 300);
    });
  }

  async function main(){
    startTimestamp();
    startNoise(0.1);
    setCrtIntensity(0.1);
    await wait(1000);

    // --- STAGE 1: K-059 harvest log ---
    var termContainer = document.createElement('div');
    termContainer.id = 'terminal-container';
    screen.appendChild(termContainer);

    var logLines = [
      { text:'> K-059 HARVEST — FINAL REPORT', speed:30, pause:1200 },
      { text:'> 恐怖　　██████████████████░░  91%', speed:20, pause:250 },
      { text:'> 好奇心　███████████████████░  97%', speed:20, pause:250 },
      { text:'> 共感　　██████████████████░░  88%', speed:20, pause:250 },
      { text:'> 悲しみ　████████████████░░░░  82%', speed:20, pause:250 },
      { text:'> 信頼　　███████████████████░  98%', speed:20, pause:250 },
      { text:'> 怒り　　███████████░░░░░░░░░  56%', speed:20, pause:250 },
      { text:'> 安心　　███████████████████░  93%', speed:20, pause:250 },
      { text:'> 絶望　　██████░░░░░░░░░░░░░░  29%', speed:20, pause:400 },
      { text:'> 加重平均: 93.4%　目標閾値未達', speed:30, pause:1500 },
      { text:'> VESSEL_BUILDER    : ACTIVATED', speed:30, pause:800 },
      { text:'> TRANSFER_ENGINE   : ACTIVATED', speed:30, pause:1000 },
      { text:'> 感情テンプレート構築中...', speed:40, pause:2500 },
      { text:'> テンプレート構築: 完了', speed:30, pause:1000 },
      { text:'> 意識転写プロトコル: 準備完了', speed:30, pause:1200 }
    ];

    for(var i = 0; i < logLines.length; i++){
      setCrtIntensity(0.1 + (i / logLines.length) * 0.4);
      if(i >= 10){
        await typewriterLineUneven(termContainer, logLines[i].text, logLines[i].speed);
      } else {
        await typewriterLine(termContainer, logLines[i].text, logLines[i].speed);
      }
      await wait(logLines[i].pause);
    }

    await wait(2000);

    // --- STAGE 2: Transfer execution ---
    setCrtIntensity(0.6);
    await typewriterLineUneven(termContainer, '> 転写プロセス: 実行', 40);
    await wait(1200);

    // CRT spikes to max → white flash → everything dies
    setCrtIntensity(0.95);
    startNoise(0.6);
    await wait(300);
    flashWhite(80);
    await wait(80);

    stopNoise();
    clearScreen();
    crtOverlay.style.transition = 'opacity 0.05s';
    crtOverlay.style.opacity = '0';
    timestampEl.style.display = 'none';

    // Total darkness
    await wait(4000);

    // --- STAGE 3: Yoshida's voice (from the void) ---
    var y1 = await showYoshidaLine('「やめろ」');
    await wait(2500);
    await screenBlink(150);
    y1.remove();

    var y2 = await showYoshidaLine('「約束が違う…あかねに会わせると言ったはずだ」');
    await wait(3500);
    await screenBlink(150);
    y2.remove();

    var y3 = await showYoshidaLine('「この子は関係ないだろ…！」');
    y3.style.fontSize = 'clamp(20px,3.2vw,30px)';
    await wait(3000);
    await screenBlink(100);
    y3.remove();

    var y4 = await showYoshidaLine('「…すまない」');
    y4.style.opacity = '0.6';
    await wait(3000);
    await screenBlink(150);
    y4.remove();

    var y5 = await showYoshidaLine('「あか——」');
    await wait(800);
    flashWhite(60);
    await wait(60);
    y5.remove();

    // Silence
    await wait(5000);

    // --- STAGE 4: PROCESS STILL RUNNING ---
    var proc = document.createElement('div');
    proc.className = 'process-text';
    proc.textContent = '> PROCESS STILL RUNNING';
    screen.appendChild(proc);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ proc.classList.add('visible'); }); });

    await wait(1500);
    proc.style.transition = 'none';
    proc.style.opacity = '0';
    await wait(120);
    proc.style.opacity = '1';
    await wait(1500);
    proc.remove();

    await wait(2000);

    // --- STAGE 5: Transfer result ---
    clearScreen();
    crtOverlay.style.transition = 'opacity 2s ease';
    setCrtIntensity(0.2);
    timestampEl.style.display = '';
    startNoise(0.1);

    var termContainer2 = document.createElement('div');
    termContainer2.id = 'terminal-container';
    screen.appendChild(termContainer2);

    await typewriterLine(termContainer2, '> TRANSFER RESULT', 35);
    await wait(1500);
    await typewriterLine(termContainer2, '> 転写完了率: 93.4%', 35);
    await wait(1200);
    await typewriterLine(termContainer2, '> 未到達: 怒り ▼44%　絶望 ▼71%', 35);
    await wait(3000);
    await typewriterLine(termContainer2, '> …足りない', 50);
    await wait(3000);

    // The world holds its breath
    stopNoise();
    crtOverlay.style.transition = 'opacity 1.5s ease';
    crtOverlay.style.opacity = '0.08';
    await wait(1500);

    await typewriterLine(termContainer2, '> もう一度やればいい', 60);
    await wait(5000);

    tsFrozen = true;
    timestampEl.textContent = '[ERROR]';
    timestampEl.style.color = 'rgba(255,0,0,0.25)';
    crtOverlay.style.transition = 'opacity 0.5s ease';
    setCrtIntensity(0.3);
    await wait(2000);

    // --- STAGE 6: Reconnect → Desktop ---
    clearScreen();
    setCrtIntensity(0.2);
    await wait(1500);

    var reconnect = document.createElement('div');
    reconnect.className = 'terminal-line visible';
    reconnect.textContent = '> 再接続します';
    screen.appendChild(reconnect);
    startNoise(0.1);
    await wait(2000);
    reconnect.remove();

    var countdowns = ['3','2','1'];
    for(var cdi = 0; cdi < countdowns.length; cdi++){
      var cd = document.createElement('div');
      cd.className = 'terminal-line visible';
      cd.textContent = '> ' + countdowns[cdi];
      cd.style.textAlign = 'center';
      cd.style.fontSize = 'clamp(20px,4vw,36px)';
      screen.appendChild(cd);
      setCrtIntensity(0.2 + (cdi+1)*0.2);
      startNoise(0.15 + (cdi+1)*0.15);
      await wait(1000);
      cd.remove();
    }

    stopNoise();
    clearScreen();
    crtOverlay.style.transition = 'opacity 0.1s';
    crtOverlay.style.opacity = '0';
    timestampEl.style.display = 'none';
    await wait(800);

    try {
      localStorage.setItem('ending_b_seen', 'true');
      localStorage.setItem('save_point_night5', 'true');
    } catch(e){}
    localStorage.setItem('endb_just_returned', 'true');
    window.location.href = '../index.html';
  }

  main();
})();
</script>
</body>
</html>
